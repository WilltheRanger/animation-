<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ant and the Melon</title>
<style>
  :root {
    --surround: #15100c;
    --panel: #211a14;
    --panel-hi: #2d241c;
    --paper: #f1e6cf;
    --muted: #9b8c74;
    --line: rgba(241, 230, 207, 0.16);
    --ink: #2b1d13;
    --melon: #e0523f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surround);
    color: var(--paper);
    font: 14px/1.3 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding-inline: 16px; padding-block: 12px;
  }
  #stage {
    position: relative; flex: none;
    width: 270px; height: 480px;
    border-radius: 6px; overflow: hidden;
    background: var(--paper);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .05);
    container-type: size;
  }
  #film { display: block; width: 100%; height: 100%; }
  .veil { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  #loading {
    justify-content: center; gap: 14px;
    background: var(--paper); color: var(--ink);
    font-size: max(13px, 3.6cqw); letter-spacing: .02em;
  }
  #loading .track { width: 46%; height: 3px; border-radius: 2px; background: rgba(43, 29, 19, .14); overflow: hidden; }
  #loading .track i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .12s linear; }
  #intro {
    justify-content: space-between;
    padding-block: 7cqh 10cqh;
    color: var(--ink);
    border: 0; background: none; width: 100%; cursor: pointer;
  }
  #intro h1 {
    margin: 0;
    font: 600 10.5cqw/1 "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    letter-spacing: -.01em; text-align: center; text-wrap: balance;
  }
  #intro h1 small {
    display: block; margin-top: 2.2cqw;
    font: 600 3cqw/1.2 ui-rounded, system-ui, sans-serif;
    letter-spacing: .18em; text-transform: uppercase; color: rgba(43, 29, 19, .62);
  }
  #intro .go { display: flex; flex-direction: column; align-items: center; gap: 2.6cqw; }
  #intro .disc {
    width: 21cqw; height: 21cqw; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ink); color: var(--paper);
    box-shadow: 0 1.4cqw 4cqw rgba(30, 20, 10, .35);
    transition: transform .15s ease;
  }
  #intro:hover .disc { transform: scale(1.05); }
  #intro:focus-visible .disc { outline: 3px solid var(--paper); outline-offset: 4px; }
  #intro .disc svg { width: 42%; height: 42%; margin-left: 8%; }
  #intro .hint {
    font: 600 3.3cqw/1 ui-rounded, system-ui, sans-serif; letter-spacing: .08em;
    color: var(--paper); background: rgba(33, 22, 14, .72);
    padding: 1.6cqw 3cqw; border-radius: 99px;
  }
  #recBadge {
    position: absolute; top: 3.2cqw; left: 3.2cqw;
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px; border-radius: 99px;
    background: rgba(21, 16, 12, .74); color: var(--paper);
    font: 600 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  #recBadge .dot, .btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--melon); flex: none; }
  #recBadge .dot { animation: pulse 1s ease-in-out infinite; }
  #toast {
    position: absolute; left: 50%; bottom: 4cqw; transform: translateX(-50%);
    width: max-content; max-width: 88%;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 10px;
    background: rgba(21, 16, 12, .86); color: var(--paper);
    font-size: 13px; line-height: 1.3;
  }
  #toast button {
    flex: none; height: 30px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 700; cursor: pointer;
  }
  #bar { flex: none; width: 270px; display: flex; flex-direction: column; gap: 10px; }
  #timeline { display: flex; gap: 3px; }
  .seg {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; gap: 6px;
    padding: 2px 0; border: 0; background: none; cursor: pointer;
    color: var(--muted); text-align: left;
    font: 700 10.5px/1 ui-rounded, system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase;
  }
  .seg span { overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .seg .trk { position: relative; height: 4px; border-radius: 2px; background: rgba(241, 230, 207, .14); overflow: hidden; }
  .seg .trk i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--paper); }
  .seg.on { color: var(--paper); }
  .seg:hover { color: var(--paper); }
  .seg:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; border-radius: 3px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .btn {
    height: 38px; display: inline-flex; align-items: center; gap: 7px;
    padding: 0 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--paper);
    font: 650 13px/1 ui-rounded, system-ui, sans-serif; cursor: pointer;
  }
  .btn:hover { background: var(--panel-hi); }
  .btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn.rec.on { border-color: rgba(224, 82, 63, .75); }
  .btn.rec.on .dot { border-radius: 2px; }
  #clock {
    margin-left: auto;
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (max-width: 400px) {
    .btn { padding: 0 11px; }
    .btn span:not(.dot) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #recBadge .dot { animation: none; }
    #intro .disc { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="film" width="1080" height="1920" aria-label="Animated film: an ant taps a giant watermelon until it splits open"></canvas>
    <div id="loading" class="veil"><span>Sharpening pencils…</span><div class="track"><i></i></div></div>
    <button id="intro" class="veil" type="button" hidden aria-label="Play the film with sound">
      <h1>The Ant and the Melon<small>A 45-second short with sound</small></h1>
      <span class="go">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.8c0-.9 1-1.5 1.8-1l13 8.2c.7.5.7 1.5 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z"/></svg></span>
        <span class="hint">Tap to play · sound on</span>
      </span>
    </button>
    <div id="recBadge" hidden><span class="dot"></span><span id="recTime">REC 0.0</span></div>
    <div id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastBtn" type="button" hidden>Save video</button></div>
  </div>
  <div id="bar">
    <div id="timeline" role="group" aria-label="Jump to a scene"></div>
    <div class="row">
      <button id="playBtn" class="btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M6 3.8c0-.9 1-1.5 1.8-1l13 8.2c.7.5.7 1.5 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z"/></svg>
        <span id="playLabel">Play</span>
      </button>
      <button id="restartBtn" class="btn" type="button" aria-label="Restart from the beginning">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>
        <span>Restart</span>
      </button>
      <button id="recBtn" class="btn rec" type="button" aria-label="Record the film to a video file">
        <span class="dot"></span><span id="recLabel">Record</span>
      </button>
      <output id="clock">0.0 / 45.0</output>
    </div>
  </div>
</div>

<!-- Music engine. cdnjs first; jsDelivr is only a fallback if cdnjs is unreachable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<script>
(() => {
'use strict';

/* =========================================================================
   TIMELINE — the one place to change timing.
   Each scene has a start and end in seconds. `cues` are named moments
   inside a scene, written as a fraction of that scene's length
   (0 = scene start, 1 = scene end). The animation and the music both read
   these, so stretching or moving a scene carries its sounds with it.
   ========================================================================= */
const SCENES = [
  { id: 'walk',  label: 'Walk',  start: 0,  end: 8,
    cues: { pause: 0.44, resume: 0.57, arrive: 0.97 } },            // stops to sniff at 3.5s, arrives 7.8s
  { id: 'tap',   label: 'Tap',   start: 8,  end: 14,
    cues: { sniff: 0.08, antenna1: 0.14, antenna2: 0.21, lift: 0.30,
            tap1: 0.40, tap2: 0.50, tap3: 0.63, look: 0.78 } },      // tap3 (11.8s) = crack appears
  { id: 'creep', label: 'Creep', start: 14, end: 30,
    cues: { edge: 0.10, lean: 0.28, glance: 0.62 } },                // crack creeps; ant peers over
  { id: 'split', label: 'Split', start: 30, end: 38,
    cues: { backAway: 0.08, pop: 0.50, land: 0.625, grab: 0.90 } },  // pop = 34.0s, lands 35.0s
  { id: 'feast', label: 'Feast', start: 38, end: 45,
    cues: { fade: 0.40 } },                                          // fade to paper from 40.8s
];

// Beats of music written for each scene. The tempo stretches with the scene,
// so phrases always land on scene boundaries (120 BPM at the default timing).
const MUSIC_BEATS = { walk: 16, tap: 12, creep: 32, split: 16, feast: 14 };

const CONFIG = {
  W: 1080, H: 1920,          // canvas pixels (portrait 9:16)
  boilFps: 8,                // line boil: hatching is re-randomised this many times a second
  boilPasses: 4,             // randomised hatch passes per layer that the boil shuffles between
  fadeColor: '#ece0c6',      // end fade colour (paper). '#000000' fades to black instead.
  posterTime: 10.4,          // frame shown under the Play button
  musicLevel: 1.5,           // overall music volume (1 = unity gain before the limiter)
  recordFps: 30,
  recordVideoBps: 8e6,
  recordTail: 0.8,           // seconds recorded after the end so the last chord rings out
};

/* ------------------------------------------------------------------------ */
const W = CONFIG.W, H = CONFIG.H;
const FILM_END = SCENES[SCENES.length - 1].end;
const sceneById = Object.fromEntries(SCENES.map(s => [s.id, s]));
const cue = (id, name) => { const s = sceneById[id]; return s.start + (s.end - s.start) * s.cues[name]; };
const sceneAt = t => SCENES.find(s => t < s.end) || SCENES[SCENES.length - 1];

/* ========================== small math kit ============================== */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, x) => clamp((x - a) / (b - a || 1e-9));
const smooth = t => t * t * (3 - 2 * t);
const easeOut3 = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t));
const easeOutBack = t => { const c = 1.7, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const frac = x => x - Math.floor(x);
const tri = x => 1 - 4 * Math.abs(frac(x + 0.25) - 0.5);           // triangle wave, period 1, -1..1
const pulse = (t, t0, a, d) => (t < t0 - a || t > t0 + d) ? 0 : t < t0 ? smooth((t - t0 + a) / a) : 1 - smooth((t - t0) / d);

function hash3(a, b = 0, c = 0) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x85ebca77) ^ Math.imul((c | 0) + 0x9e3779b9, 0xc2b2ae3d);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
const rand3 = (a, b, c) => hash3(a, b, c) / 4294967296;
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function vnoise(x, seed = 0) {                                      // smooth value noise, -1..1
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = rand3(i, seed, 7), b = rand3(i + 1, seed, 7);
  return (a + (b - a) * u) * 2 - 1;
}
// Keyframe track: keys are [time, value, ease?]; ease shapes the segment that ends at that key.
function track(keys) {
  const k = keys.slice().sort((a, b) => a[0] - b[0]);
  return t => {
    if (t <= k[0][0]) return k[0][1];
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) {
        const p = k[i - 1], q = k[i];
        return lerp(p[1], q[1], (q[2] || smooth)(invLerp(p[0], q[0], t)));
      }
    }
    return k[k.length - 1][1];
  };
}
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };

/* ============================ the world ================================= */
// A giant melon seen from a low camera: only the top of a huge ellipse is in frame.
const MELON = { cx: 540, cy: 1905, a: 930, b: 830 };               // top of rind at y = 1075
const RIND = 46;
const FLESH = { cx: 540, cy: 1905, a: MELON.a - RIND, b: MELON.b - RIND };
const ellipseY = (E, x) => { const u = (x - E.cx) / E.a; return E.cy - E.b * Math.sqrt(Math.max(0, 1 - u * u)); };
const fleshTopY = x => ellipseY(FLESH, x) + 2.4 * vnoise(x * 0.045, 3) + 1.3 * vnoise(x * 0.14, 4);

// Walkable top edge of an ellipse, addressed by arc length (0 at the crest).
function makeSurface(E) {
  const N = 1600, PSI = 1.3;
  const X = new Float64Array(N + 1), Y = new Float64Array(N + 1), S = new Float64Array(N + 1);
  for (let i = 0; i <= N; i++) {
    const p = -PSI + (2 * PSI * i) / N;
    X[i] = E.cx + E.a * Math.sin(p);
    Y[i] = E.cy - E.b * Math.cos(p);
    S[i] = i ? S[i - 1] + Math.hypot(X[i] - X[i - 1], Y[i] - Y[i - 1]) : 0;
  }
  const mid = S[N / 2];
  for (let i = 0; i <= N; i++) S[i] -= mid;
  const find = (A, v) => { let lo = 0, hi = N; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (A[m] <= v) lo = m; else hi = m; } return lo; };
  return {
    at(s) {
      const i = clamp(find(S, s), 0, N - 1);
      const f = clamp((s - S[i]) / (S[i + 1] - S[i]), -3, 4);
      const ang = Math.atan2(Y[i + 1] - Y[i], X[i + 1] - X[i]);
      return { x: X[i] + (X[i + 1] - X[i]) * f, y: Y[i] + (Y[i + 1] - Y[i]) * f, ang, nx: Math.sin(ang), ny: -Math.cos(ang) };
    },
    sAtX(x) { const i = find(X, x); return S[i] + (S[i + 1] - S[i]) * (x - X[i]) / (X[i + 1] - X[i]); },
  };
}
const MELON_SURF = makeSurface(MELON);
const FLESH_SURF = makeSurface(FLESH);

/* ============================== crack =================================== */
const CRACK = (() => {
  const rng = mulberry32(4242);
  const x0 = 578, y0 = ellipseY(MELON, 578) + 2;
  const main = [[x0, y0]];
  let x = x0, y = y0, side = 1;
  while (y < H + 170) {
    const depth = clamp((y - y0) / (H - y0));
    const seg = lerp(10, 58, Math.pow(depth, 0.85)) * (0.6 + 0.8 * rng());
    if (rng() < 0.8) side = -side;
    const centre = x0 + 55 * Math.sin(depth * 3.3 + 0.4) - 40 * depth;
    const pull = clamp((centre - x) / 140, -0.45, 0.45);
    const ang = Math.PI / 2 + side * (0.5 + 0.55 * rng()) - pull;
    x += Math.cos(ang) * seg;
    y += Math.sin(ang) * seg * lerp(0.72, 1, depth);                   // foreshortened near the top
    main.push([x, y]);
  }
  // Fine jaggies between the main zig-zag corners.
  const pts = [main[0]];
  for (let i = 1; i < main.length; i++) {
    const [ax, ay] = main[i - 1], [bx, by] = main[i];
    const len = Math.hypot(bx - ax, by - ay) || 1, n = Math.max(1, Math.round(len / 13));
    for (let k = 1; k <= n; k++) {
      const u = k / n, j = k < n ? (rng() - 0.5) * 3.4 : 0;
      pts.push([ax + (bx - ax) * u - ((by - ay) / len) * j, ay + (by - ay) * u + ((bx - ax) / len) * j]);
    }
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = cum[cum.length - 1];
  // Side branches that splinter off while the crack races down.
  const branches = [];
  for (let b = 0; b < 9; b++) {
    const idx = Math.floor(lerp(0.14, 0.9, (b + rng() * 0.8) / 9) * (pts.length - 1));
    const [rx, ry] = pts[idx], [nx2, ny2] = pts[Math.min(idx + 1, pts.length - 1)];
    const dir = Math.atan2(ny2 - ry, nx2 - rx) + (rng() < 0.5 ? -1 : 1) * (0.8 + 0.5 * rng());
    const bp = [[rx, ry]], bc = [0];
    let bx = rx, by = ry, a = dir, L = lerp(12, 30, idx / pts.length) * (0.8 + 0.5 * rng());
    const nseg = 2 + Math.floor(rng() * 3);
    for (let k = 0; k < nseg; k++) {
      a += (rng() - 0.5) * 0.9;
      bx += Math.cos(a) * L; by += Math.sin(a) * L;
      bp.push([bx, by]); bc.push(bc[bc.length - 1] + L); L *= 0.72;
    }
    branches.push({ root: cum[idx], delay: 18 + 40 * rng(), pts: bp, cum: bc, total: bc[bc.length - 1] });
  }
  const pointAt = L => {
    let i = 1; while (i < cum.length - 1 && cum[i] < L) i++;
    const f = clamp((L - cum[i - 1]) / (cum[i] - cum[i - 1] || 1));
    return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)];
  };
  return { x0, y0, pts, cum, total, branches, pointAt };
})();

// How long the crack is at time t — creeping in bursts, then racing.
const CRACK_T = (() => {
  const rng = mulberry32(99);
  const appear = cue('tap', 'tap3');
  const creepA = sceneById.creep.start, creepB = sceneById.creep.end;
  const raceA = sceneById.split.start, raceB = cue('split', 'pop') - 0.32;
  const L0a = 16, L0b = 40, L1 = CRACK.total * 0.46;
  const bursts = [];
  for (let t = creepA + 0.35; t < creepB - 0.45; t += 0.65 + 0.85 * rng()) bursts.push({ t, w: 0.6 + 0.8 * rng(), d: 0.13 + 0.17 * rng() });
  const wsum = bursts.reduce((a, b) => a + b.w, 0);
  let acc = L0b;
  for (const b of bursts) { b.from = acc; acc += (L1 - L0b) * b.w / wsum; b.to = acc; }
  const EXP = 2.1;
  function L(t) {
    if (t < appear) return 0;
    if (t < creepA) return lerp(0, L0a, easeOut3(clamp((t - appear) / 0.14))) + (L0b - L0a) * smooth(invLerp(appear + 0.3, creepA, t));
    if (t < raceA) {
      let v = L0b;
      for (const b of bursts) { if (t < b.t) break; v = lerp(b.from, b.to, easeOut3(clamp((t - b.t) / b.d))); }
      return v;
    }
    return lerp(L1, CRACK.total, Math.pow(invLerp(raceA, raceB, t), EXP));
  }
  // Crackle ticks while it races: one each time the tip passes another ~24px.
  const fastTicks = [];
  for (let l = L1 + 24; l < CRACK.total; l += 24) fastTicks.push(raceA + (raceB - raceA) * Math.pow((l - L1) / (CRACK.total - L1), 1 / EXP));
  const lastBurst = t => { let lb = -9; for (const b of bursts) { if (b.t <= t) lb = b.t; else break; } return lb; };
  return { L, bursts, fastTicks, appear, raceA, raceB, lastBurst };
})();

/* ===================== hatching engine (colored pencil) ================== */
// A style is one pencil: colour, width, alpha. Strokes are split across a few
// groups that are stroked separately so overlaps build up like real pencil.
function styles(defs, groups = 5) {
  return defs.map(([color, width, alpha]) => ({ color, width, alpha, g: Array.from({ length: groups }, () => []) }));
}
function drawStyles(g, list) {
  for (const s of list) {
    g.strokeStyle = s.color; g.lineWidth = s.width; g.globalAlpha = s.alpha;
    for (const arr of s.g) {
      if (!arr.length) continue;
      g.beginPath();

// Walk a jittered grid of short strokes across a box. `pick(x, y, rng)` returns

// Pre-rendered boil passes. Each pass is a fresh random hatching of the layer;
// the film shuffles between them eight times a second.
class BoilLayer {

/* ---------------- lighting + stripe field shared by melon and flesh -------- */
const LIGHT = (() => { const v = [-0.5, 0.74, 0.46], l = Math.hypot(...v); return v.map(c => c / l); })();

  F.diff = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
  F.spec = Math.pow(Math.max(0, nx * HALFV[0] + ny * HALFV[1] + nz * HALFV[2]), 36);
  F.ring = Math.sqrt(Math.max(1e-6, 1 - u * u));
  F.phi = Math.acos(clamp(v / F.ring, -1, 1));                    // 0 on the silhouette, pi/2 facing us

}

/* ------------------------------ paper ----------------------------------- */
function makePaper() {
  const c = mkCanvas(W, H), g = c.getContext('2d'), rng = mulberry32(7);
  g.fillStyle = '#ece0c6'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = rng() * W, y = rng() * H, r = 80 + rng() * 260;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rng() < 0.5 ? 'rgba(206,180,138,0.05)' : 'rgba(255,252,240,0.09)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  g.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    g.strokeStyle = pass ? 'rgba(255,251,240,0.3)' : 'rgba(170,146,110,0.1)';
    g.lineWidth = pass ? 1.2 : 0.9;
    g.beginPath();
    for (let i = 0; i < 280; i++) {
      const x = rng() * W, y = rng() * H, a = rng() * TAU, l = 6 + rng() * 18;
      g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.6) * l * 0.5, y + Math.sin(a + 0.6) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
    }

  }
  for (const [col, n] of [['rgba(120,95,60,0.10)', 7000], ['rgba(255,255,248,0.35)', 5000]]) {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) g.fillRect(rng() * W, rng() * H, 1 + rng() * 1.2, 1 + rng() * 1.2);
  }
  return c;
}
// Paper tooth: pale specks laid over the drawing so pencil looks grainy.
// It is nudged to a new offset on each boil tick, like a fresh sheet per drawing.
function makeTooth() {
  const c = mkCanvas(W + 64, H + 64), g = c.getContext('2d'), rng = mulberry32(11);

    g.fillStyle = `rgba(252,247,234,${0.12 + lv * 0.08})`;
    for (let i = 0; i < 7000; i++) { const s = 0.8 + rng() * 1.5; g.fillRect(rng() * (W + 64), rng() * (H + 64), s, s * (0.5 + rng())); }
  }
  g.fillStyle = 'rgba(70,50,30,0.12)';
  for (let i = 0; i < 9000; i++) g.fillRect(rng() * (W + 64), rng() * (H + 64), 1, 1);

}

  const gr = g.createRadialGradient(W / 2, H * 0.5, H * 0.28, W / 2, H * 0.5, H * 0.82);
  gr.addColorStop(0, 'rgba(70,45,20,0)');
  gr.addColorStop(1, 'rgba(70,45,20,0.22)');

}

/* ------------------------------ sky -------------------------------------- */
const SUN = { x: 238, y: 585, r: 100 };
const CLOUDS = [
  { x: 800, y: 395, base: 26, puffs: [[-128, 8, 56], [-66, -24, 70], [6, -38, 80], [80, -14, 64], [138, 10, 46], [-10, 12, 66]] },
  { x: 872, y: 840, base: 14, puffs: [[-56, 4, 32], [-18, -14, 42], [28, -6, 36], [60, 6, 24]] },

const inCloud = (x, y) => CLOUDS.some(c => y < c.y + c.base && c.puffs.some(([px, py, r]) => (x - c.x - px) ** 2 + (y - c.y - py) ** 2 < r * r));

function buildSky(g, rng) {
  const box = { x0: 0, y0: 0, x1: W, y1: 1330 };
  // Sky: a soft under-layer of broad pencil, then loose long strokes — cool at the top, warm at the horizon.
  const skyWash = styles([['#a9bfca', 8, 0.2], ['#bccbcb', 8, 0.2], ['#e4cc9c', 8, 0.2]], 4);
  hatch(rng, box, { angle: -0.22, gap: 9, lenMin: 50, lenMax: 90, jitter: 0.06, spacing: 0.6 }, (x, y, r) => {
    if (y > fleshTopY(x) - 2 || inCloud(x, y) || Math.hypot(x - SUN.x, y - SUN.y) < SUN.r + 30) return null;
    const warm = smooth(invLerp(520, 1150, y + (r() - 0.5) * 260));
    return skyWash[warm > 0.5 ? 2 : (r() * 2) | 0];
  });
  const sky = styles([['#96b2c0', 2.8, 0.5], ['#a9c1cb', 2.8, 0.5], ['#bfcfcf', 2.6, 0.48], ['#e5c68f', 2.8, 0.48], ['#ecd3a4', 2.6, 0.48]], 6);
  hatch(rng, box, { angle: -0.22, gap: 6, lenMin: 34, lenMax: 70, jitter: 0.07, spacing: 0.75 }, (x, y, r) => {
    if (y > fleshTopY(x) - 2 || inCloud(x, y) || Math.hypot(x - SUN.x, y - SUN.y) < SUN.r + 36) return null;
    const top = 1 - smooth(clamp(y / 1250));
    if (r() > 0.3 + 0.55 * top * top) return null;
    const warm = smooth(invLerp(560, 1150, y + (r() - 0.5) * 260));

  const field = styles([['#a3a86e', 2.1, 0.8], ['#8f9a5c', 2.1, 0.8], ['#b8b582', 2.0, 0.75], ['#7d8a4d', 1.8, 0.7]]);
  hatch(rng, { x0: 0, y0: 1130, x1: W, y1: 1330 }, { angle: -0.62, gap: 5.2, lenMin: 9, lenMax: 16 }, (x, y, r) => {
    const hy = hillY(x); if (y < hy || y > fleshTopY(x) - 2) return null;
    return field[y - hy < 12 && r() < 0.5 ? 3 : (r() * 3) | 0];
  });
  drawStyles(g, sky); drawStyles(g, field);
  let hill = [];
  for (let x = -10; x <= W + 24; x += 14) {
    if (hillY(x) < fleshTopY(x) - 4 && x <= W + 10) hill.push([x, hillY(x)]);
    else { if (hill.length > 1) sketchLine(g, hill, rng, 1.4, '#6f7c43', 2, 0.7); hill = []; }
  }

  g.strokeStyle = '#5d6b34'; g.lineWidth = 2; g.beginPath();
  for (let i = 0; i < 46; i++) {
    const x = i < 23 ? rng() * 150 : W - rng() * 150, y = hillY(x) + 4 + rng() * 14, h = 16 + rng() * 34, lean = (rng() - 0.5) * 18;
    g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.3, y - h * 0.6, x + lean, y - h);

  const sun = styles([['#f4c95d', 2.2, 0.9], ['#efb84a', 2.2, 0.85], ['#f7da86', 2.0, 0.9], ['#e9a23d', 1.8, 0.7]]);
  const sb = { x0: SUN.x - SUN.r, y0: SUN.y - SUN.r, x1: SUN.x + SUN.r, y1: SUN.y + SUN.r };
  hatch(rng, sb, { angle: 0.85, gap: 4.2, lenMin: 8, lenMax: 15 }, (x, y, r) => {
    const d = Math.hypot(x - SUN.x, y - SUN.y) / SUN.r; if (d > 0.97) return null;

  sketchLine(g, ring, rng, 2.2, '#dd9636', 2.4, 0.85);
  g.strokeStyle = '#efc464'; g.lineWidth = 2.2; g.globalAlpha = 0.8; g.beginPath();
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * TAU + (rng() - 0.5) * 0.12, r0 = SUN.r + 16 + rng() * 8, r1 = r0 + 16 + rng() * 22;
    g.moveTo(SUN.x + Math.cos(a) * r0, SUN.y + Math.sin(a) * r0); g.lineTo(SUN.x + Math.cos(a) * r1, SUN.y + Math.sin(a) * r1);
  }
  g.stroke(); g.globalAlpha = 1;
  // Clouds: white pencil fill, scalloped edges and shaded bellies.
  const cwhite = styles([['#faf6ec', 3.2, 0.85], ['#f6f1e4', 3.2, 0.85]]);
  const cshade = styles([['#aebfc1', 2.0, 0.72], ['#c1cdcb', 2.0, 0.65]]);
  for (const c of CLOUDS) {
    const cb = { x0: c.x - 200, y0: c.y - 130, x1: c.x + 200, y1: c.y + c.base };
    hatch(rng, cb, { angle: -0.36, gap: 4, lenMin: 10, lenMax: 20 }, (x, y, r) => (inCloud(x, y) && r() < 0.92 ? cwhite[(r() * 2) | 0] : null));

    });
  }
  drawStyles(g, cwhite); drawStyles(g, cshade);
  g.strokeStyle = '#8fa6a8'; g.lineWidth = 2.3; g.lineCap = 'round';

      const cx = c.x + px, cy = c.y + py;
      for (let a = Math.PI * 1.02; a < Math.PI * 2 - 0.02; a += 0.14) {
        const x = cx + Math.cos(a) * r + (rng() - 0.5) * 1.6, y = cy + Math.sin(a) * r + (rng() - 0.5) * 1.6;

    const xs = c.puffs.map(p => c.x + p[0]);
    sketchLine(g, [[Math.min(...xs) - 30, c.y + c.base], [Math.max(...xs) + 26, c.y + c.base]], rng, 1.5, '#8fa6a8', 2, 0.7);
  }
}

/* ------------------------------ melon rind ------------------------------- */
const MEL_BOX = { x0: -60, y0: 1020, x1: 1140, y1: 2000 };

    washD: styles([['#2d6629', 6, 0.36], ['#265a24', 6, 0.36]], 3),
    washDL: styles([['#1b441e', 6, 0.38], ['#17391a', 6, 0.38]], 3),

    lightMid: styles([['#8cb454', 2.4, 0.88], ['#7ba74b', 2.4, 0.88], ['#9bbe60', 2.3, 0.88], ['#6f9c44', 2.3, 0.88]]),
    lightLo: styles([['#628f3e', 2.4, 0.88], ['#578536', 2.4, 0.88], ['#6b9845', 2.3, 0.88], ['#4c7a31', 2.3, 0.88]]),

const RED_BOX = { x0: 40, y0: 1090, x1: 1140, y1: 1930 };

/* ============================ the split =================================== */

/* ======================= juice, pop lines, crumbs ======================== */

/* =============================== camera =================================== */
const CAM = (() => {

/* ================================ render ================================== */
let PAPER, TOOTH, VIGNETTE;
const LAYERS = {
  sky: new BoilLayer({ name: 'sky', box: { x0: 0, y0: 0, x1: W, y1: 1330 }, res: 1.2, seed: 1, passes: 3, build: buildSky }),
  melon: new BoilLayer({ name: 'melon', box: MEL_BOX, res: 1.05, seed: 2, passes: CONFIG.boilPasses, build: buildMelon }),
  flesh: new BoilLayer({ name: 'flesh', box: RED_BOX, res: 1.5, seed: 3, passes: CONFIG.boilPasses, build: buildFlesh }),

/* ================================ music =================================== */
const AUDIO = { ready: false, failed: false, N: null, score: null, loading: null };

  if (window.Tone) return Promise.resolve(true);

  AUDIO.loading = new Promise(res => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js';
    s.onload = () => res(!!window.Tone); s.onerror = () => res(false);
    (document.head || document.documentElement).appendChild(s);
    setTimeout(() => res(!!window.Tone), 15000);

}
if (!window.Tone) loadTone();                                        // cdnjs didn't load: fetch the fallback now

    hold(T.land + 0.25, T.grab - T.land - 0.25, (time, into) => N.padOn(['A2', 'D3', 'E3', 'A3'], time, into, T.grab - T.land - 0.25, 0.35));

  const tracks = [...canvas.captureStream(CONFIG.recordFps).getVideoTracks()];

  for (const L of Object.values(LAYERS)) for (let i = 0; i < L.passes; i++) jobs.push(() => L.render(i));
  const still = params.has('t');
  for (let i = 0; i < jobs.length; i++) {
    jobs[i]();

    if (!still) await new Promise(r => setTimeout(r, 0));

  if (still) { player.t = clamp(parseFloat(params.get('t')) || 0, 0, FILM_END); document.body.dataset.still = '1'; }
