<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The American Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap">
<style>
  :root {
    --surround: #15100c;
    --panel: #211a14;
    --panel-hi: #2d241c;
    --paper: #f1e6cf;
    --muted: #9b8c74;
    --line: rgba(241, 230, 207, 0.16);
    --ink: #2b1d13;
    --rec: #c8412f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surround);
    color: var(--paper);
    font: 14px/1.3 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding-inline: 16px; padding-block: 12px;
  }
  #stage {
    position: relative; flex: none;
    width: 270px; height: 480px;
    border-radius: 6px; overflow: hidden;
    background: var(--paper);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .05);
    container-type: size;
  }
  #film { display: block; width: 100%; height: 100%; }
  .veil { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  #loading {
    justify-content: center; gap: 14px;
    background: var(--paper); color: var(--ink);
    font-size: max(13px, 3.6cqw); letter-spacing: .02em;
  }
  #loading .track { width: 46%; height: 3px; border-radius: 2px; background: rgba(43, 29, 19, .14); overflow: hidden; }
  #loading .track i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .12s linear; }
  #intro {
    justify-content: flex-end;
    padding-block: 0 11cqh;
    color: var(--ink);
    border: 0; background: none; width: 100%; cursor: pointer;
  }
  #intro .go { display: flex; flex-direction: column; align-items: center; gap: 2.6cqw; }
  #intro .disc {
    width: 21cqw; height: 21cqw; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ink); color: var(--paper);
    box-shadow: 0 1.4cqw 4cqw rgba(30, 20, 10, .35);
    transition: transform .15s ease;
  }
  #intro:hover .disc { transform: scale(1.05); }
  #intro:focus-visible .disc { outline: 3px solid var(--paper); outline-offset: 4px; }
  #intro .disc svg { width: 42%; height: 42%; margin-left: 8%; }
  #intro .hint {
    font: 600 3.3cqw/1 ui-rounded, system-ui, sans-serif; letter-spacing: .08em;
    color: var(--paper); background: rgba(33, 22, 14, .72);
    padding: 1.6cqw 3cqw; border-radius: 99px;
  }
  #recBadge {
    position: absolute; top: 3.2cqw; left: 3.2cqw;
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px; border-radius: 99px;
    background: rgba(21, 16, 12, .74); color: var(--paper);
    font: 600 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  #recBadge .dot, .btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); flex: none; }
  #recBadge .dot { animation: pulse 1s ease-in-out infinite; }
  #toast {
    position: absolute; left: 50%; bottom: 4cqw; transform: translateX(-50%);
    width: max-content; max-width: 88%;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 10px;
    background: rgba(21, 16, 12, .86); color: var(--paper);
    font-size: 13px; line-height: 1.3;
  }
  #toast button {
    flex: none; height: 30px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 700; cursor: pointer;
  }
  #bar { flex: none; width: 270px; display: flex; flex-direction: column; gap: 10px; }
  #now { display: flex; align-items: center; gap: 8px; }
  #nowText { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  #nowDate { font: 700 10px/1 ui-rounded, system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  #nowName { max-width: 100%; font: 650 14px/1.2 ui-rounded, system-ui, sans-serif; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--paper); cursor: pointer;
  }
  .nav:hover { background: var(--panel-hi); }
  .nav:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .nav:disabled { opacity: .4; cursor: default; }
  .nav svg { width: 16px; height: 16px; }
  #timeline { display: flex; gap: 2px; }
  .seg { flex: 1 1 0; min-width: 0; padding: 8px 0; border: 0; background: none; cursor: pointer; }
  .seg i { position: relative; display: block; height: 5px; border-radius: 1.5px; background: rgba(241, 230, 207, .16); overflow: hidden; }
  .seg i b { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--paper); }
  .seg.on i { background: rgba(241, 230, 207, .32); }
  .seg:hover i { background: rgba(241, 230, 207, .42); }
  .seg:focus-visible { outline: 2px solid var(--paper); outline-offset: 1px; border-radius: 2px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .btn {
    height: 38px; display: inline-flex; align-items: center; gap: 7px;
    padding: 0 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--paper);
    font: 650 13px/1 ui-rounded, system-ui, sans-serif; cursor: pointer;
  }
  .btn:hover { background: var(--panel-hi); }
  .btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn.rec.on { border-color: rgba(200, 65, 47, .75); }
  .btn.rec.on .dot { border-radius: 2px; }
  #clock {
    margin-left: auto;
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (max-width: 400px) {
    .btn { padding: 0 11px; }
    .btn span:not(.dot) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #recBadge .dot { animation: none; }
    #intro .disc { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="film" width="1080" height="1920" aria-label="Animated film: the American Revolution from 1763 to 1789, drawn in colored pencil"></canvas>
    <div id="loading" class="veil"><span>Sharpening pencils…</span><div class="track"><i></i></div></div>
    <button id="intro" class="veil" type="button" hidden aria-label="Play the film with sound">
      <span class="go">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.8c0-.9 1-1.5 1.8-1l13 8.2c.7.5.7 1.5 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z"/></svg></span>
        <span class="hint">Tap to play · sound on</span>
      </span>
    </button>
    <div id="recBadge" hidden><span class="dot"></span><span id="recTime">REC 0.0</span></div>
    <div id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastBtn" type="button" hidden>Save video</button></div>
  </div>
  <div id="bar">
    <div id="now">
      <button id="prevBtn" class="nav" type="button" aria-label="Previous scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg></button>
      <div id="nowText"><span id="nowDate">1763</span><span id="nowName">British North America</span></div>
      <button id="nextBtn" class="nav" type="button" aria-label="Next scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="timeline" role="group" aria-label="Jump to a scene"></div>
    <div class="row">
      <button id="playBtn" class="btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M6 3.8c0-.9 1-1.5 1.8-1l13 8.2c.7.5.7 1.5 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z"/></svg>
        <span id="playLabel">Play</span>
      </button>
      <button id="restartBtn" class="btn" type="button" aria-label="Restart from the beginning">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>
        <span>Restart</span>
      </button>
      <button id="recBtn" class="btn rec" type="button" aria-label="Record the film to a video file">
        <span class="dot"></span><span id="recLabel">Record</span>
      </button>
      <output id="clock">0:00 / 10:00</output>
    </div>
  </div>
</div>

<!-- Music engine. cdnjs first; jsDelivr is only a fallback if cdnjs is unreachable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<script>
(() => {
'use strict';

/* =========================================================================
   TIMELINE — the one place to change timing.
   Each scene has a start and end in seconds. `cues` are named moments
   inside a scene, written as a fraction of that scene's length
   (0 = scene start, 1 = scene end). The animation and the music both read
   these, so stretching or moving a scene carries its sounds with it.
   ========================================================================= */
// [id, label shown under the film, seconds, cues]. Scenes follow on from each other.
const SCENE_LIST = [
  ['colonies',     '1763',          22, { coast: 3 / 36, names: 12 / 36, line: 19 / 36, ship: 26 / 36 }],
  ['stamp',        '1765',          20, { nail: 6 / 36, stamp: 18 / 36, fire: 24 / 36 }],
  ['spinning',     '1767',          18, {}],
  ['massacre',     '1770',          22, { face: 6 / 30, snow: 11 / 30, fire: 17 / 30, flee: 18 / 30 }],
  ['tea',          '1773',          24, { throws: 2.5 / 35 }],
  ['blockade',     '1774',          16, {}],
  ['congress',     'Sep 1774',      16, { gavel: 0.5 / 20, speak: 3 / 20, quote: 9 / 20 }],
  ['revere',       'Apr 1775',      24, { lanterns: 2 / 52, ride: 14 / 52 }],
  ['lexington',    'Apr 1775',      22, { halt: 14 / 32, ready: 16 / 32, aim: 17.5 / 32, fire: 19 / 32, reply: 21 / 32, march: 27 / 32 }],
  ['concord',      'Apr 1775',      18, { fire: 8 / 24, retreat: 12 / 24 }],
  ['bunker',       'Jun 1775',      26, { volley: 16 / 36, second: 26 / 36 }],
  ['command',      'Jul 1775',      18, { halt: 11 / 30, sword: 14 / 30, cheer: 20 / 30 }],
  ['paine',        'Jan 1776',      18, { lift: 13 / 30, page: 15 / 30, copies: 22 / 30 }],
  ['declaration',  'Jul 1776',      24, { header: 0.03, title: 0.1, preamble: 0.26, truths: 0.4, more: 0.63, sign: 0.69, others: 0.86 }],
  ['statue',       'Jul 1776',      16, { fall: 16 / 28 }],
  ['retreat',      'Aug 1776',      16, {}],
  ['delaware',     'Dec 1776',      18, { strokes: 1 / 24, shore: 18 / 24 }],
  ['trenton',      'Dec 1776',      14, { charge: 6 / 28 }],
  ['saratoga',     'Oct 1777',      22, { swords: 20 / 40 }],
  ['valley',       '1777–78',       24, { drill: 12 / 30, step: 17 / 30, present: 24 / 30 }],
  ['france',       'Feb 1778',      18, { sign: 21 / 33 }],
  ['monmouth',     'Jun 1778',      18, { shot: 10 / 30, takes: 14 / 30 }],
  ['jones',        'Sep 1779',      24, { broadside: 6 / 36, quote: 18 / 36 }],
  ['swamp',        '1780',          16, {}],
  ['siege',        'Oct 1781',      22, {}],
  ['yorktown',     'Oct 1781',      24, { chorus: 16 / 64 }],
  ['treaty',       'Sep 1783',      16, { sign: 12 / 24 }],
  ['farewell',     'Dec 1783',      16, { hand: 10 / 20 }],
  ['constitution', 'Sep 1787',      20, { header: 0.03, preamble: 0.14, articles: 0.5, sign: 0.66, others: 0.8 }],
  ['inauguration', 'Apr 1789',      16, { oath: 7 / 24, cheer: 11 / 24 }],
  ['finale',       'The End',       12, { title: 0.08, end: 0.4, fade: 0.72 }],
];
const SCENES = [];
for (let i = 0, t = 0; i < SCENE_LIST.length; i++) {
  const [id, label, dur, cues] = SCENE_LIST[i];
  SCENES.push({ id, label, start: t, end: t + dur, cues }); t += dur;
}

// Beats of music written for each scene. The tempo stretches with the scene,
// so phrases always land on scene boundaries.
const MUSIC_BEATS = {
  colonies: 36, stamp: 36, spinning: 27, massacre: 30, tea: 35, blockade: 20, congress: 20, revere: 52, lexington: 32, concord: 24,
  bunker: 36, command: 30, paine: 30, declaration: 32, statue: 28, retreat: 20, delaware: 24, trenton: 28, saratoga: 40, valley: 30,
  france: 33, monmouth: 30, jones: 36, swamp: 24, siege: 32, yorktown: 64, treaty: 24, farewell: 20, constitution: 28, inauguration: 24, finale: 16,
};

// Caption card at the foot of each scene: [date line, sentence].
const CAPTIONS = {
  colonies:     ['1763 · British North America', 'Britain wins the French and Indian War but is deep in debt. It closes the land beyond the mountains to settlers and looks to its thirteen colonies to help pay.'],
  stamp:        ['1765 · The Stamp Act', 'A new tax on newspapers, legal papers, even playing cards. Colonists protest: “No taxation without representation!”'],
  spinning:     ['1767 · The Townshend Acts', 'Britain taxes glass, paint, paper and tea. Colonists boycott British goods, and women spin their own cloth.'],
  massacre:     ['March 5, 1770 · Boston', 'British soldiers fire into a crowd, killing five colonists. It becomes known as the Boston Massacre.'],
  tea:          ['December 16, 1773 · Boston', 'Protesting a British tax on tea, colonists dump 342 chests of tea into the harbor.'],
  blockade:     ['1774 · The Intolerable Acts', 'In punishment, Britain closes Boston Harbor and puts Massachusetts under military rule.'],
  congress:     ['September 1774 · Philadelphia', 'Delegates from twelve colonies meet as the First Continental Congress to resist the new laws.'],
  revere:       ['April 18, 1775 · Boston', 'Two lanterns in the Old North Church: the British are coming by sea. Paul Revere rides to warn the countryside.'],
  lexington:    ['April 19, 1775 · Lexington', 'At dawn, British troops and colonial militia exchange fire on the town green. The war has begun.'],
  concord:      ['April 19, 1775 · Concord', 'At the North Bridge the militia fire back — “the shot heard round the world” — and the British retreat to Boston.'],
  bunker:       ['June 17, 1775 · Bunker Hill', 'The British take the hill on their third charge, but more than a thousand of their men are killed or wounded.'],
  command:      ['July 3, 1775 · Cambridge', 'George Washington takes command of the new Continental Army.'],
  paine:        ['January 1776 · Philadelphia', 'Thomas Paine’s pamphlet Common Sense makes the case for independence. Over 100,000 copies are sold.'],
  declaration:  ['July 4, 1776 · Philadelphia', 'Congress adopts the Declaration of Independence.'],
  statue:       ['July 9, 1776 · New York', 'After hearing the Declaration read aloud, a crowd pulls down the statue of King George III.'],
  retreat:      ['August 1776 · Brooklyn', 'Beaten on Long Island, Washington’s army escapes across the East River by night, hidden by fog.'],
  delaware:     ['December 25, 1776 · Delaware River', 'On Christmas night, Washington’s army crosses the icy river in a snowstorm.'],
  trenton:      ['December 26, 1776 · Trenton', 'At dawn they surprise the Hessian troops holding Trenton and take about 900 prisoners.'],
  saratoga:     ['October 17, 1777 · Saratoga', 'A whole British army surrenders at Saratoga. It is the turning point of the war.'],
  valley:       ['Winter 1777–78 · Valley Forge', 'The army shivers through the winter in log huts. Baron von Steuben drills it into a disciplined force.'],
  france:       ['February 6, 1778 · Paris', 'Benjamin Franklin wins an alliance with France. French money, soldiers and ships join the fight.'],
  monmouth:     ['June 28, 1778 · Monmouth', 'In fierce heat, legend says “Molly Pitcher” carried water to the troops, then took her husband’s place at a cannon.'],
  jones:        ['September 23, 1779 · North Sea', 'His own ship burning and sinking, Captain John Paul Jones fights on and captures HMS Serapis. “I have not yet begun to fight!”'],
  swamp:        ['1780 · South Carolina', 'The war moves south. From the swamps, Francis Marion’s raiders strike and vanish — the “Swamp Fox.”'],
  siege:        ['Autumn 1781 · Yorktown', 'A French fleet blocks the Chesapeake Bay while American and French guns pound the British army at Yorktown.'],
  yorktown:     ['October 19, 1781 · Yorktown', 'Trapped by American and French forces, the British army surrenders.'],
  treaty:       ['September 3, 1783 · Paris', 'The Treaty of Paris ends the war. Britain recognizes the United States as independent.'],
  farewell:     ['December 23, 1783 · Annapolis', 'Instead of seizing power, Washington hands his commission back to Congress and goes home.'],
  constitution: ['September 17, 1787 · Philadelphia', 'Delegates sign a new plan of government: the Constitution of the United States.'],
  inauguration: ['April 30, 1789 · New York', 'George Washington takes the oath of office as the first President of the United States.'],
  finale:       null,
};
// Longer names for the scene bar.
const SCENE_NAMES = {
  colonies: 'British North America', stamp: 'The Stamp Act', spinning: 'The Townshend Acts', massacre: 'The Boston Massacre',
  tea: 'The Boston Tea Party', blockade: 'The Intolerable Acts', congress: 'The First Continental Congress', revere: 'Paul Revere’s Ride',
  lexington: 'Lexington', concord: 'Concord', bunker: 'Bunker Hill', command: 'Washington Takes Command', paine: 'Common Sense',
  declaration: 'The Declaration of Independence', statue: 'Down Comes the King', retreat: 'Escape from Long Island', delaware: 'Crossing the Delaware',
  trenton: 'Trenton', saratoga: 'Saratoga', valley: 'Valley Forge', france: 'The French Alliance', monmouth: 'Monmouth', jones: 'John Paul Jones',
  swamp: 'The Swamp Fox', siege: 'The Siege of Yorktown', yorktown: 'Surrender at Yorktown', treaty: 'The Treaty of Paris', farewell: 'Washington Resigns',
  constitution: 'The Constitution', inauguration: 'The First President', finale: 'The United States of America',
};

const CONFIG = {
  W: 1080, H: 1920,          // canvas pixels (portrait 9:16)
  boilFps: 8,                // line boil: hatching is re-randomised this many times a second
  boilPasses: 3,             // randomised hatch passes per layer that the boil shuffles between
  fadeColor: '#ece0c6',      // colour of the dips between scenes and the end fade (paper)
  dip: [0.3, 0.38],          // seconds of fade out / fade in at each scene change
  posterTime: 17.2,          // frame shown under the Play button
  musicLevel: 1.4,           // overall music volume (1 = unity gain before the limiter)
  recordFps: 30,
  recordVideoBps: 2.4e6,     // keeps a 10-minute recording under about 200 MB
  recordTail: 0.8,           // seconds recorded after the end so the last chord rings out
};

/* ------------------------------------------------------------------------ */
const W = CONFIG.W, H = CONFIG.H;
const FILM_END = SCENES[SCENES.length - 1].end;
const sceneById = Object.fromEntries(SCENES.map(s => [s.id, s]));
const cue = (id, name) => { const s = sceneById[id]; return s.start + (s.end - s.start) * s.cues[name]; };
const sceneAt = t => SCENES.find(s => t < s.end) || SCENES[SCENES.length - 1];
const beatOf = id => { const s = sceneById[id], b = (s.end - s.start) / MUSIC_BEATS[id]; return beats => s.start + beats * b; };
const beatLen = id => (sceneById[id].end - sceneById[id].start) / MUSIC_BEATS[id];
const durOf = id => sceneById[id].end - sceneById[id].start;
// Each scene registers its drawing (SCN) and its music (SCORE) next to its own code.
const SCN = {}, SCORE = {};

/* ========================== small math kit ============================== */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, x) => clamp((x - a) / (b - a || 1e-9));
const smooth = t => t * t * (3 - 2 * t);
const easeOut3 = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeIn2 = t => t * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t));
const easeOutBack = t => { const c = 1.7, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const frac = x => x - Math.floor(x);
const pulse = (t, t0, a, d) => (t < t0 - a || t > t0 + d) ? 0 : t < t0 ? smooth((t - t0 + a) / a) : 1 - smooth((t - t0) / d);
const win = (t, a, b, fi = 0.3, fo = 0.3) => Math.min(smooth(invLerp(a, a + fi, t)), 1 - smooth(invLerp(b - fo, b, t)));

function hash3(a, b = 0, c = 0) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x85ebca77) ^ Math.imul((c | 0) + 0x9e3779b9, 0xc2b2ae3d);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
const rand3 = (a, b, c) => hash3(a, b, c) / 4294967296;
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function vnoise(x, seed = 0) {                                      // smooth value noise, -1..1
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = rand3(i, seed, 7), b = rand3(i + 1, seed, 7);
  return (a + (b - a) * u) * 2 - 1;
}
function vnoise2(x, y, seed = 0) {                                  // 2-D value noise, -1..1
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = rand3(i, j, seed), b = rand3(i + 1, j, seed), c = rand3(i, j + 1, seed), d = rand3(i + 1, j + 1, seed);

function makePaper() {
  const c = mkCanvas(W, H), g = c.getContext('2d'), rng = mulberry32(7);
  g.fillStyle = '#ece0c6'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = rng() * W, y = rng() * H, r = 80 + rng() * 260;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rng() < 0.5 ? 'rgba(206,180,138,0.05)' : 'rgba(255,252,240,0.09)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  g.lineCap = 'round';
  for (let pass = 0; pass < 2; pass++) {
    g.strokeStyle = pass ? 'rgba(255,251,240,0.3)' : 'rgba(170,146,110,0.1)';
    g.lineWidth = pass ? 1.2 : 0.9;
    g.beginPath();
    for (let i = 0; i < 280; i++) {

      g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.6) * l * 0.5, y + Math.sin(a + 0.6) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
    }
    g.stroke();
  }
  for (const [col, n] of [['rgba(120,95,60,0.10)', 7000], ['rgba(255,255,248,0.35)', 5000]]) {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) g.fillRect(rng() * W, rng() * H, 1 + rng() * 1.2, 1 + rng() * 1.2);
  }

}

  const drone = new T.PolySynth(T.Synth, { oscillator: { type: 'fatsawtooth', count: 3, spread: 16 }, envelope: { attack: 1.2, decay: 0.2, sustain: 1, release: 1.2 } });
  drone.connect(drF); route(drF, 0.85, 0.35); drone.volume.value = -17;
  // Soft horns.
  const brF = new T.Filter({ type: 'lowpass', frequency: 1700, Q: 1 });
  const brass = new T.PolySynth(T.Synth, { oscillator: { type: 'fatsawtooth', count: 2, spread: 9 }, envelope: { attack: 0.08, decay: 0.3, sustain: 0.72, release: 0.55 } });
  brass.connect(brF); route(brF, 0.8, 0.38); brass.volume.value = -14;
  // Glockenspiel and a church bell.
  const glock = route(new T.PolySynth(T.FMSynth, {
    harmonicity: 4, modulationIndex: 1.6, oscillator: { type: 'sine' }, modulation: { type: 'sine' },
    envelope: { attack: 0.002, decay: 1.2, sustain: 0, release: 1.1 }, modulationEnvelope: { attack: 0.002, decay: 0.3, sustain: 0, release: 0.3 },
  }), 0.75, 0.5);
  glock.volume.value = -19;
  const bell = route(new T.PolySynth(T.FMSynth, {
    harmonicity: 1.41, modulationIndex: 9, oscillator: { type: 'sine' }, modulation: { type: 'sine' },
    envelope: { attack: 0.002, decay: 4, sustain: 0, release: 3 }, modulationEnvelope: { attack: 0.002, decay: 1.6, sustain: 0, release: 1 },
  }), 0.7, 0.7);
  bell.volume.value = -16;
  // Plucked bass.
  const pluck = route(new T.PolySynth(T.MonoSynth, {
    oscillator: { type: 'sawtooth' }, filter: { type: 'lowpass', Q: 1.2, rolloff: -24 },
    envelope: { attack: 0.003, decay: 0.35, sustain: 0, release: 0.25 },
    filterEnvelope: { attack: 0.002, decay: 0.12, sustain: 0.12, release: 0.2, baseFrequency: 150, octaves: 3.2, exponent: 2 },
  }), 0.95, 0.22);
  pluck.volume.value = -11;
  // Musket shots, cannon-like boom.
  const shotN = new T.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.12 } });
  const shotF = new T.Filter({ type: 'lowpass', frequency: 2600, Q: 0.6 }); shotN.connect(shotF); route(shotF, 1, 0.6); shotN.volume.value = -3;
  const boom = new T.MembraneSynth({ pitchDecay: 0.08, octaves: 4, envelope: { attack: 0.002, decay: 0.8, sustain: 0, release: 0.2 } });
  route(boom, 1, 0.45); boom.volume.value = -5;
  // Water, whoosh, quill, clicks: short filtered noise.
  const spN = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.004, decay: 0.42, sustain: 0, release: 0.1 } });
  const spF = new T.Filter({ type: 'lowpass', frequency: 3000, Q: 0.8 }); spN.connect(spF); route(spF, 0.9, 0.35); spN.volume.value = -13;
  const plop = new T.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.002, decay: 0.12, sustain: 0, release: 0.05 } });
  route(plop, 0.9, 0.3); plop.volume.value = -9;
  const whN = new T.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.08, decay: 0.2, sustain: 0, release: 0.08 } });
  const whF = new T.Filter({ type: 'bandpass', frequency: 600, Q: 1.4 }); whN.connect(whF); route(whF, 0.8, 0.3); whN.volume.value = -16;
  const qN = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.006, decay: 0.06, sustain: 0, release: 0.02 } });
  const qF = new T.Filter({ type: 'bandpass', frequency: 4300, Q: 2.6 }); qN.connect(qF); route(qF, 0.8, 0.12); qN.volume.value = -22;
  const ck = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.022, sustain: 0, release: 0.01 } });
  const ckF = new T.Filter({ type: 'bandpass', frequency: 2800, Q: 1.8 }); ck.connect(ckF); route(ckF, 0.9, 0.2); ck.volume.value = -14;
  const knock = new T.MembraneSynth({ pitchDecay: 0.01, octaves: 1.6, envelope: { attack: 0.001, decay: 0.09, sustain: 0, release: 0.03 } });
  route(knock, 0.9, 0.25); knock.volume.value = -12;
  // Continuous textures: wind and harbour water.
  const wind = new T.Noise('pink'), windF = new T.Filter({ type: 'bandpass', frequency: 520, Q: 0.9 }), windG = new T.Gain(0);
  const windL = new T.LFO(0.11, 320, 980); windL.connect(windF.frequency); windL.start();
  wind.chain(windF, windG); route(windG, 0.9, 0.3);
  const harb = new T.Noise('brown'), harbF = new T.Filter({ type: 'lowpass', frequency: 360, Q: 0.6 }), harbG = new T.Gain(0);
  harb.chain(harbF, harbG); route(harbG, 0.9, 0.2);
  const bird = new T.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.005, decay: 0.08, sustain: 0.3, release: 0.04 } });
  route(bird, 0.5, 0.4); bird.volume.value = -24;
  // A crowd: two bands of noise that swell and ebb; a cheer; a roaring fire; a spinning wheel.
  const crowd = new T.Noise('pink'), crowdF = new T.Filter({ type: 'bandpass', frequency: 640, Q: 0.8 }), crowdF2 = new T.Filter({ type: 'peaking', frequency: 1600, Q: 1.2, gain: 7 }), crowdG = new T.Gain(0);
  const crowdL = new T.LFO(0.37, 420, 980); crowdL.connect(crowdF.frequency); crowdL.start();
  crowd.chain(crowdF, crowdF2, crowdG); route(crowdG, 0.8, 0.35);
  const cheerN = new T.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.18, decay: 1.1, sustain: 0.25, release: 0.9 } });
  const cheerF = new T.Filter({ type: 'bandpass', frequency: 950, Q: 0.8 }); cheerN.connect(cheerF); route(cheerF, 0.85, 0.4); cheerN.volume.value = -12;
  const fireN = new T.Noise('brown'), fireF = new T.Filter({ type: 'lowpass', frequency: 760, Q: 0.5 }), fireG = new T.Gain(0);
  fireN.chain(fireF, fireG); route(fireG, 0.9, 0.2);
  const whirN = new T.Noise('pink'), whirF = new T.Filter({ type: 'bandpass', frequency: 250, Q: 2.2 }), whirG = new T.Gain(0);
  const whirL = new T.LFO(1.4, 180, 330); whirL.connect(whirF.frequency); whirL.start();
  whirN.chain(whirF, whirG); route(whirG, 0.9, 0.2);
  // A continuous source for one scene: fade in, hold, fade out, and stop just before the
  // scene ends so the next scene can start the same source again.
  const loop = (src, g, key, time, into, dur, level, fade = 1.2) => {
    const rem = dur - into; if (rem <= 0.08) return;
    const f = Math.min(fade, rem / 2);
    g.gain.cancelScheduledValues(time); g.gain.setValueAtTime(into > 0 ? level : 0, time);
    if (!(into > 0)) g.gain.linearRampToValueAtTime(level, time + f);
    g.gain.setValueAtTime(level, time + Math.max(0.01, rem - f)); g.gain.linearRampToValueAtTime(0, time + rem - 0.03);
    time = after(key, time); src.start(time); src.stop(time + rem - 0.015);
  };

  const N = {
    out, master,
    fife(note, time, dur, vel = 0.6) {
      fife.triggerAttackRelease(note, dur, time, vel);
      chiff.triggerAttackRelease(0.03, after('chiff', time), vel * 0.8);
    },
    snare(time, v = 0.5) { time = after('sn', time); snN.triggerAttackRelease(0.1, time, v); snB.triggerAttackRelease('E3', 0.05, time, v * 0.7); },
    bd(time, v = 0.6, note = 'D2') { bd.triggerAttackRelease(note, 0.3, after('bd', time), v); },
    str(notes, time, dur, vel = 0.4) { strings.triggerAttackRelease(notes, dur, time, vel); },
    strOn(notes, time, into, dur, vel) { const rem = dur - into; if (rem > 0.05) strings.triggerAttackRelease(notes, rem, time, vel); },
    droneOn(notes, time, into, dur, vel = 0.5) { const rem = dur - into; if (rem > 0.05) drone.triggerAttackRelease(notes, rem, time, vel); },
    brass(notes, time, dur, vel = 0.5) { brass.triggerAttackRelease(notes, dur, time, vel); },
    glock: (note, time, vel = 0.4, dur = 1) => glock.triggerAttackRelease(note, dur, time, vel),
    bell: (note, time, vel = 0.5, dur = 3) => bell.triggerAttackRelease(note, dur, time, vel),
    pz: (note, time, vel = 0.7, dur = 0.3) => pluck.triggerAttackRelease(note, dur, time, vel),
    volley(time, n, spread, v) {
      for (let k = 0; k < n; k++) shotN.triggerAttackRelease(0.22, after('shot', time + spread * (k / n) + 0.01 * rnd()), v * (0.8 + 0.2 * rnd()));
      boom.triggerAttackRelease('A1', 0.5, after('boom', time), v);
    },
    thunk(time) { boom.triggerAttackRelease('D2', 0.2, after('boom', time), 0.9); knock.triggerAttackRelease('G2', 0.08, after('knock', time), 0.9); shotN.triggerAttackRelease(0.08, after('shot', time), 0.35); },
    splash(time, v = 0.6) {
      time = after('sp', time);
      spF.frequency.setValueAtTime(4200, time); spF.frequency.exponentialRampToValueAtTime(420, time + 0.4);
      spN.triggerAttackRelease(0.34, time, v);
      plop.triggerAttackRelease(420, 0.1, time, v); plop.frequency.setValueAtTime(420, time); plop.frequency.exponentialRampToValueAtTime(140, time + 0.1);
    },
    whoosh(time, v = 0.5) { time = after('wh', time); whF.frequency.setValueAtTime(380, time); whF.frequency.exponentialRampToValueAtTime(1900, time + 0.3); whN.triggerAttackRelease(0.22, time, v); },
    quill(time, v = 0.3) { time = after('q', time); qF.frequency.setValueAtTime(3600 + 1600 * rnd(), time); qN.triggerAttackRelease(0.03 + 0.05 * rnd(), time, v); },
    click(time, v = 0.5) { time = after('ck', time); ckF.frequency.setValueAtTime(2200 + 2400 * rnd(), time); ck.triggerAttackRelease(0.015, time, v); },
    clatter(time, v = 0.6) { for (let k = 0; k < 4; k++) N.click(time + k * 0.03 + 0.01 * rnd(), v * (1 - k * 0.18)); knock.triggerAttackRelease('A2', 0.06, after('knock', time), v); },
    windOn(time, into, dur) {
      loop(wind, windG, 'wind', time, into, dur, 0.22);
      for (let k = Math.ceil(into / 2.2); k * 2.2 < dur - 1; k++) { const at = time + k * 2.2 - into; if (at > time) { windG.gain.setValueAtTime(0.22, at); windG.gain.linearRampToValueAtTime(0.34 + 0.1 * Math.sin(k), at + 1); windG.gain.linearRampToValueAtTime(0.22, at + 2.1); } }
    },
    harbourOn(time, into, dur) { loop(harb, harbG, 'harb', time, into, dur, 0.5); },
    crowdOn(time, into, dur, level = 0.5, fade = 1.2) { loop(crowd, crowdG, 'crowd', time, into, dur, level, fade); },
    fireOn(time, into, dur, level = 0.5, fade = 1.2) { loop(fireN, fireG, 'fire', time, into, dur, level, fade); },
    whirrOn(time, into, dur, level = 0.5) { loop(whirN, whirG, 'whirr', time, into, dur, level); },
    cheer(time, v = 0.6, len = 1.2) { time = after('cheer', time); cheerF.frequency.setValueAtTime(760, time); cheerF.frequency.linearRampToValueAtTime(1350, time + 0.5); cheerN.triggerAttackRelease(len, time, v); },
    crackle(time, v = 0.4) { time = after('ck', time); ckF.frequency.setValueAtTime(900 + 1600 * rnd(), time); ck.triggerAttackRelease(0.01 + 0.02 * rnd(), time, v); },
    gavel(time, v = 0.8) { knock.triggerAttackRelease('D3', 0.06, after('knock', time), v); N.click(time, v * 0.7); },
    hoof(time, v = 0.6) { knock.triggerAttackRelease(rnd() < 0.5 ? 'G2' : 'A2', 0.05, after('knock', time), v); N.click(time + 0.004, v * 0.35); },
    chirp(time) {
      const f0 = 2600 + 900 * rnd();
      bird.triggerAttackRelease(f0, 0.11, after('bird', time), 0.5);
      bird.frequency.setValueAtTime(f0, time); bird.frequency.exponentialRampToValueAtTime(f0 * 1.5, time + 0.05); bird.frequency.exponentialRampToValueAtTime(f0 * 1.1, time + 0.1);
    },
    fadeOut(time, into, dur) {
      const p0 = clamp(into / dur), rem = Math.max(0.05, dur - into);
      master.gain.cancelScheduledValues(time);
      master.gain.setValueAtTime(LEVEL * (1 - p0), time);
      master.gain.linearRampToValueAtTime(LEVEL * (1 - p0) * 0.45, time + rem * 0.6);
      master.gain.linearRampToValueAtTime(0, time + rem);
    },
    silence() {
      const now = T.now();
      for (const s of [fife, strings, drone, brass, glock, bell, pluck, cheerN]) { try { s.releaseAll ? s.releaseAll(now) : s.triggerRelease(now); } catch (e) { /* idle */ } }
      for (const src of [wind, harb, crowd, fireN, whirN]) { try { if (src.state === 'started') src.stop(now); } catch (e) { /* already stopped */ } }
      for (const p of [windG.gain, harbG.gain, crowdG.gain, fireG.gain, whirG.gain, master.gain]) p.cancelScheduledValues(now);
      for (const gg of [windG, harbG, crowdG, fireG, whirG]) gg.gain.setValueAtTime(0, now);
      master.gain.setValueAtTime(LEVEL, now);
    },
  };
  N.ready = reverb.ready || Promise.resolve();
  return N;
}

// The score, written against the same SCENES/cues the animation uses. Each scene's
// music lives in SCORE[id] and gets a toolkit of instruments plus its own beat clock.
function buildScore(N) {
  const ev = [];
  const one = (t, fn) => ev.push({ t, fn, dur: 0, sustain: false });
  const hold = (t, dur, fn) => ev.push({ t, fn, dur, sustain: true });
  const fife = (t, note, dur, vel = 0.6) => one(t, time => N.fife(note, time, dur * 0.9, vel));
  const pz = (t, note, vel = 0.7, dur = 0.3) => one(t, time => N.pz(note, time, vel, dur));
  const glock = (t, note, vel = 0.4, dur = 1) => one(t, time => N.glock(note, time, vel, dur));
  const bell = (t, note, vel = 0.5, dur = 3) => one(t, time => N.bell(note, time, vel, dur));
  const sn = (t, v) => one(t, time => N.snare(time, v));
  const flam = (t, v) => { sn(t - 0.028, v * 0.45); sn(t, v); };
  const roll = (t0, t1, v0, v1, rate = 0.045) => { for (let t = t0; t < t1 - 1e-3; t += rate) sn(t, lerp(v0, v1, invLerp(t0, t1, t))); };
  const bd = (t, v, note) => one(t, time => N.bd(time, v, note));
  const str = (t, dur, notes, vel = 0.4) => one(t, time => N.str(notes, time, dur, vel));
  const strH = (t, dur, notes, vel) => hold(t, dur, (time, into) => N.strOn(notes, time, into, dur, vel));
  const brass = (t, dur, notes, vel = 0.5) => one(t, time => N.brass(notes, time, dur, vel));
  const up = (n, k) => window.Tone.Frequency(n).transpose(k).toNote();
  const K = { N, ev, one, hold, fife, pz, glock, bell, sn, flam, roll, bd, str, strH, brass, up };
  for (const s of SCENES) {
    if (!SCORE[s.id]) continue;
    const B = beatOf(s.id), b = beatLen(s.id);
    // A melody as [beat, note, beats] rows, on the fife (or any voice via `play`).
    const mel = (list, vel, oct = 0, play = null) => { for (const [bb, n, d] of list) { const note = oct ? up(n, 12 * oct) : n; play ? play(B(bb), note, d * b, vel) : fife(B(bb), note, d * b, vel); } };
    SCORE[s.id](K, { id: s.id, s, B, b, dur: s.end - s.start, mel });
  }
  return ev.sort((a, b) => a.t - b.t);
}

// 1763 — drum roll, the fife tune, the colony names on the glockenspiel; the Proclamation
// Line in a darker key, and a British ship.
SCORE.colonies = (K, { B, b, s, mel }) => {
  const { N, one, fife, pz, glock, sn, flam, roll, bd, strH, brass } = K;
  roll(B(0) + 0.05, B(2) - 0.05, 0.1, 0.6, b / 8);
  bd(B(2), 0.75);
  mel([[2, 'A4', 0.5], [2.5, 'D5', 0.5], [3, 'F#5', 0.5], [3.5, 'A5', 0.5], [4, 'G5', 0.5], [4.5, 'F#5', 0.5], [5, 'E5', 0.5], [5.5, 'D5', 0.5],
    [6, 'E5', 0.5], [6.5, 'F#5', 0.5], [7, 'G5', 0.5], [7.5, 'E5', 0.5], [8, 'F#5', 1], [9, 'D5', 1],
    [10, 'A4', 0.5], [10.5, 'D5', 0.5], [11, 'F#5', 0.5], [11.5, 'A5', 0.5], [12, 'B5', 0.5], [12.5, 'A5', 0.5], [13, 'G5', 0.5], [13.5, 'F#5', 0.5],
    [14, 'G5', 0.5], [14.5, 'E5', 0.5], [15, 'F#5', 0.5], [15.5, 'D5', 0.5], [16, 'E5', 1], [17, 'D5', 1]], 0.62);
  for (const [bb, n] of [[4, 'A5'], [8, 'G5'], [12, 'C#6'], [16, 'F#5']]) fife(B(bb) - b / 8, n, b / 9, 0.4);            // grace notes
  ['G6', 'E6', 'F#6', 'A6', 'D6', 'F#6', 'A5', 'D6', 'F#6', 'A6', 'B6', 'A6', 'G6'].forEach((n, k) => glock(COL.nameT[k], n, 0.42, 0.9));
  for (let bb = 2; bb < 18; bb++) { if (bb % 2 === 0) flam(B(bb), 0.55); else sn(B(bb), 0.45); sn(B(bb + 0.5), 0.22); }
  roll(B(9.5), B(10) - 0.02, 0.25, 0.5, b / 8); roll(B(13.5), B(14) - 0.02, 0.25, 0.6, b / 8); roll(B(17.5), B(18) - 0.02, 0.3, 0.7, b / 8);
  for (let bb = 4; bb < 18; bb += 2) bd(B(bb), 0.5);
  bd(B(18), 0.75);
  [['D3', 'A2'], ['G2', 'D3'], ['A2', 'E3'], ['D3', 'A2'], ['D3', 'F#3'], ['G2', 'D3'], ['A2', 'E3'], ['D3', 'A2']].forEach(([r5, f5], k) => { pz(B(2 + 2 * k), r5, 0.7); pz(B(3 + 2 * k), f5, 0.55); });
  strH(B(2), B(8) - B(2), ['D3', 'A3', 'F#4'], 0.22);
  strH(B(8), B(14) - B(8), ['D3', 'A3', 'D4'], 0.2);
  strH(B(14), B(18) - B(14) + 0.1, ['A2', 'E3', 'C#4'], 0.2);
  // The line across the mountains: D minor, a walking pizzicato.
  strH(B(19), B(26) - B(19), ['D3', 'F3', 'A3'], 0.24);
  ['D2', 'A2', 'F2', 'A2', 'D2', 'A2', 'Bb1', 'F2', 'G1', 'D2', 'A1', 'E2', 'A1', 'C#2'].forEach((n, k) => pz(B(19 + 0.5 * k), n, k % 2 ? 0.45 : 0.62, 0.25));
  one(B(19), time => N.bell('D3', time, 0.35, 4));
  // A British man-of-war sails in.
  for (const [bb, n, d] of [[26, ['D3', 'A3'], 1.5], [27.5, ['F3', 'A3'], 0.5], [28, ['E3', 'G3'], 1], [29, ['D3', 'F3'], 1], [30, ['C#3', 'E3', 'A3'], 2]]) brass(B(bb), d * b * 0.95, n, 0.42);
  strH(B(26), B(32) - B(26), ['D2', 'A2'], 0.2);
  for (let bb = 26; bb < 32; bb++) { sn(B(bb), 0.18 + 0.02 * (bb - 26)); sn(B(bb + 0.5), 0.12); }
  strH(B(32), s.end - B(32) + 0.2, ['A2', 'E3', 'G3', 'C#4'], 0.26);
  roll(B(32), s.end - 0.05, 0.1, 0.62, 0.045);
  pz(B(32), 'A1', 0.8, 0.8); bd(B(34), 0.5); bd(B(35), 0.6);
};

// 1773 — a sneaking pizzicato in D minor, twice round; whooshes and splashes as the chests go over.
SCORE.tea = (K, { B, b, s, dur, mel }) => {
  const { N, one, hold, pz, glock, sn, strH, up } = K;
  hold(s.start, dur, (time, into) => N.harbourOn(time, into, dur));
  const bars = [['D3', 'A2', 'D3', 'F3'], ['E3', 'A2', 'C#3', 'E3'], ['D3', 'A2', 'D3', 'F3'], ['G3', 'D3', 'Bb2', 'D3'], ['F3', 'D3', 'A2', 'D3'], ['Bb2', 'F3', 'D3', 'F3'], ['A2', 'E3', 'C#3', 'E3'], ['D3', 'A2', 'D2', null]];
  for (const off of [0, 16]) bars.forEach((bar, k) => bar.forEach((n, j) => { if (n) pz(B(off + 2 * k + 0.5 * j), n, j ? 0.5 : 0.68, 0.22); }));
  const tune = [[4, 'A4', 0.5], [4.5, 'D5', 0.5], [5, 'E5', 0.5], [5.5, 'F5', 0.5], [6, 'G5', 0.5], [6.5, 'F5', 0.5], [7, 'E5', 0.5], [7.5, 'D5', 0.5],
    [8, 'F5', 0.5], [8.5, 'E5', 0.5], [9, 'D5', 0.5], [9.5, 'A4', 0.5], [10, 'Bb4', 0.5], [10.5, 'D5', 0.5], [11, 'F5', 0.5], [11.5, 'D5', 0.5],
    [12, 'E5', 0.5], [12.5, 'C#5', 0.5], [13, 'A4', 0.5], [13.5, 'C#5', 0.5], [14, 'D5', 1.5]];
  mel(tune, 0.42);
  mel(tune.map(([bb, n, d]) => [bb + 16, n, d]), 0.46);
  for (const [bb, n, d] of tune) glock(B(bb + 16), up(n, 12), 0.16, d * b * 1.4);
  for (let bb = 0; bb < 34; bb++) sn(B(bb + 0.5), 0.14);
  strH(B(8), B(16) - B(8) - 0.2, ['D3', 'A3', 'F4'], 0.18);
  strH(B(20), B(32) - B(20), ['D3', 'A3', 'D4', 'F4'], 0.22);

  rec.mr.onstop = onRecorded;
  rec.mr.start(1000);
  player.recording = true;
  $('recBadge').hidden = false;
  await playFrom(0);
  if ($('toast').hidden) toast('Recording the whole film — keep this tab in front.', 2600);
}
function stopRecording() {
  if (!player.recording) return;
  player.recording = false;
  if (rec.mr && rec.mr.state !== 'inactive') rec.mr.stop();
  if (player.playing) pause();
  $('recBadge').hidden = true;
  syncUI();
}
async function onRecorded() {
  if (rec.dest && AUDIO.ready) { try { AUDIO.N.out.disconnect(rec.dest); } catch (e) { /* already disconnected */ } }
  if (rec.keep) { try { rec.keep.stop(); rec.keep.disconnect(); } catch (e) { /* already stopped */ } rec.keep = null; }
  rec.blob = new Blob(rec.chunks, { type: rec.mime || 'video/webm' });
  showPoster('Watch again');
  syncUI();
  await saveVideo();
}
const DOWNLOADS = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveVideo() {
  if (!rec.blob) return;
  const name = 'the-american-revolution.' + rec.ext;
  const mb = (rec.blob.size / 1048576).toFixed(1);
  const dl = await DOWNLOADS;
  if (dl) {
    try { await dl.save({ filename: name, data: rec.blob }); toast(`Saved ${name} (${mb} MB).`, 4000); return; }
    catch (err) { toast(err && err.code === 'declined' ? 'Video not saved.' : 'Couldn’t save the video here.', 0, { label: 'Save video', fn: saveVideo }); return; }
  }
  const url = URL.createObjectURL(rec.blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast(`Downloaded ${name} (${mb} MB).`, 6000, { label: 'Save again', fn: saveVideo });
}
let toastTimer = 0, toastAction = null;
function toast(msg, ms = 0, action = null) {
  $('toastMsg').textContent = msg; $('toast').hidden = false;
  toastAction = action; $('toastBtn').hidden = !action; if (action) $('toastBtn').textContent = action.label;
  clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast() { $('toast').hidden = true; }

// Scene bar: the current scene's date and name, previous/next, and a strip with one
// segment per scene (tap one to jump to it).
const jumpTo = i => { if (!player.ready || player.recording) return; unlockAudio(); playFrom(SCENES[clamp(i, 0, SCENES.length - 1)].start); };
const nowIndex = () => (player.poster ? -1 : sceneIndexAt(clamp(player.t, 0, FILM_END - 1e-6)));
const segs = SCENES.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'seg'; b.type = 'button'; b.style.flexGrow = s.end - s.start;
  b.title = `${s.label} · ${SCENE_NAMES[s.id]}`;
  b.setAttribute('aria-label', `Scene ${i + 1} of ${SCENES.length}: ${SCENE_NAMES[s.id]}, ${s.label}`);
  b.innerHTML = '<i><b></b></i>';
  b.addEventListener('click', () => jumpTo(i));
  $('timeline').appendChild(b);
  return b;
});
$('prevBtn').addEventListener('click', () => { const i = nowIndex(), s = SCENES[Math.max(0, i)]; jumpTo(i < 0 ? 0 : player.t - s.start > 2 ? i : i - 1); });
$('nextBtn').addEventListener('click', () => jumpTo(nowIndex() + 1));
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let shownScene = null;
function updateClock() {
  const t = player.poster ? 0 : clamp(player.t, 0, FILM_END), i = nowIndex(), sc = SCENES[Math.max(0, i)];
  $('clock').textContent = `${mmss(t)} / ${mmss(FILM_END)}`;
  SCENES.forEach((s, k) => {
    segs[k].querySelector('b').style.width = (100 * invLerp(s.start, s.end, t)) + '%';
    segs[k].classList.toggle('on', k === i);
  });
  if (shownScene !== sc.id) {
    shownScene = sc.id;
    $('nowDate').textContent = `${SCENES.indexOf(sc) + 1} / ${SCENES.length} · ${sc.label}`;
    $('nowName').textContent = SCENE_NAMES[sc.id];
  }
  if (player.recording) $('recTime').textContent = 'REC ' + mmss(t);
}
function syncUI() {
  $('playLabel').textContent = player.playing ? 'Pause' : 'Play';
  $('playBtn').setAttribute('aria-label', player.playing ? 'Pause' : 'Play');
  $('playIcon').setAttribute('d', player.playing ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M6 3.8c0-.9 1-1.5 1.8-1l13 8.2c.7.5.7 1.5 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z');
  $('recBtn').classList.toggle('on', player.recording);
  $('recLabel').textContent = player.recording ? 'Stop' : 'Record';
  $('playBtn').disabled = $('restartBtn').disabled = $('prevBtn').disabled = $('nextBtn').disabled = player.recording;
}
function togglePlay() {
  if (!player.ready || player.recording) return;
  if (player.playing) pause();
  else playFrom(player.poster ? 0 : player.t);
}
$('intro').addEventListener('click', () => { unlockAudio(); if (player.ready && !player.recording) playFrom(0); });
$('playBtn').addEventListener('click', () => { if (!player.playing) unlockAudio(); togglePlay(); });
$('restartBtn').addEventListener('click', () => { unlockAudio(); if (player.ready && !player.recording) playFrom(0); });
$('recBtn').addEventListener('click', () => {
  if (!player.ready) return;
  if (player.recording) stopRecording(); else { unlockAudio(); startRecording(); }
});
$('toastBtn').addEventListener('click', () => { const a = toastAction; hideToast(); if (a) a.fn(); });
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); if (!player.playing) unlockAudio(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') $('restartBtn').click();
  else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prevBtn').click(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); $('nextBtn').click(); }
});

function layout() {
  const app = $('app'), cs = getComputedStyle(app);
  const aw = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - $('bar').offsetHeight - 12;
  let h = Math.max(160, ah), w = h * 9 / 16;
  if (w > aw) { w = aw; h = w * 16 / 9; }
  $('stage').style.width = Math.floor(w) + 'px'; $('stage').style.height = Math.floor(h) + 'px';
  $('bar').style.width = Math.floor(Math.max(w, Math.min(aw, 320))) + 'px';
}
window.addEventListener('resize', layout);
layout();

// Draw the first scene's pencil passes (with a progress bar), then show the Play button;
// the other scenes keep drawing in the background.
async function init() {
  PAPER = makePaper(); TOOTH = makeTooth(); VIGNETTE = makeVignette(ctx);
  makePatterns(ctx);
  await fontsReady();
  const still = params.has('t');
  const t0 = still ? clamp(parseFloat(params.get('t')) || 0, 0, FILM_END) : CONFIG.posterTime;
  if (still) flushScene(sceneIndexAt(t0));
  else await prepareScene(sceneIndexAt(t0), 3, p => { $('loading').querySelector('i').style.width = (100 * p) + '%'; });
  $('loading').hidden = true;
  player.ready = true;
  if (still) { player.t = t0; player.poster = false; document.body.dataset.still = '1'; }
  else $('intro').hidden = false;
  player.dirty = true;
  render(ctx, player.t, { poster: player.poster });
  syncUI();
}
requestAnimationFrame(tick);
const ready = init();
// Hooks for automated checks: render any moment deterministically.
window.__film = {
  ready, SCENES, cue, audio: { buildInstruments, buildScore }, jobs: () => JOBS.length, jobStats: JOB_STATS,
  render: (t, o) => { planLayers(sceneIndexAt(t)); render(ctx, t, o); },
  prepare: t => flushScene(sceneIndexAt(t)),
  kit: { ctx, drawFigure, basePose, walkPose, carry, mixPose, shiftPose, armAt, drawHorse, horsePose, drawRider, riderPose, makeGun, drawGun, OUTFITS, LIGHTS, FIG, paper: () => PAPER },
  layers: () => [...LAYER_USE].map(([L, uses]) => ({ name: L.name, scene: SCENES[uses[0]].id, px: L.variants.reduce((a, c) => a + (c ? c.width * c.height : 0), 0), n: L.ready.length })),
};
})();
</script>
