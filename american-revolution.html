<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The American Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap">
<style>
  :root {
    --surround: #15100c;
    --panel: #211a14;
    --panel-hi: #2d241c;
    --paper: #f1e6cf;
    --muted: #9b8c74;
    --line: rgba(241, 230, 207, 0.16);
    --ink: #2b1d13;
    --rec: #c8412f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surround);
    color: var(--paper);
    font: 14px/1.3 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; }
  #app {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding-inline: 16px; padding-block: 12px;
  }
  #stage {
    position: relative; flex: none;
    width: 270px; height: 480px;
    border-radius: 6px; overflow: hidden;
    background: var(--paper);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .05);
    container-type: size;
  }
  #film { display: block; width: 100%; height: 100%; }
  .veil { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  #loading {
    justify-content: center; gap: 14px;
    background: var(--paper); color: var(--ink);
    font-size: max(13px, 3.6cqw); letter-spacing: .02em;
  }
  #loading .track { width: 46%; height: 3px; border-radius: 2px; background: rgba(43, 29, 19, .14); overflow: hidden; }
  #loading .track i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .12s linear; }
  #intro {
    justify-content: flex-end;
    padding-block: 0 11cqh;
    color: var(--ink);
    border: 0; background: none; width: 100%; cursor: pointer;
  }
  #intro .go { display: flex; flex-direction: column; align-items: center; gap: 2.6cqw; }
  #intro .disc {
    width: 21cqw; height: 21cqw; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--ink); color: var(--paper);
    box-shadow: 0 1.4cqw 4cqw rgba(30, 20, 10, .35);
    transition: transform .15s ease;
  }
  #intro:hover .disc { transform: scale(1.05); }
  #intro:focus-visible .disc { outline: 3px solid var(--paper); outline-offset: 4px; }
  #intro .disc svg { width: 42%; height: 42%; margin-left: 8%; }
  #intro .hint {
    font: 600 3.3cqw/1 ui-rounded, system-ui, sans-serif; letter-spacing: .08em;
    color: var(--paper); background: rgba(33, 22, 14, .72);
    padding: 1.6cqw 3cqw; border-radius: 99px;
  }
  #recBadge {
    position: absolute; top: 3.2cqw; left: 3.2cqw;
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px; border-radius: 99px;
    background: rgba(21, 16, 12, .74); color: var(--paper);
    font: 600 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  #recBadge .dot, .btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); flex: none; }
  #recBadge .dot { animation: pulse 1s ease-in-out infinite; }
  #toast {
    position: absolute; left: 50%; bottom: 4cqw; transform: translateX(-50%);
    width: max-content; max-width: 88%;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 10px;
    background: rgba(21, 16, 12, .86); color: var(--paper);
    font-size: 13px; line-height: 1.3;
  }
  #toast button {
    flex: none; height: 30px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 700; cursor: pointer;
  }
  #bar { flex: none; width: 270px; display: flex; flex-direction: column; gap: 10px; }
  #timeline { display: flex; gap: 3px; }
  .seg {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; gap: 6px;
    padding: 2px 0; border: 0; background: none; cursor: pointer;
    color: var(--muted); text-align: left;
    font: 700 10px/1 ui-rounded, system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase;
  }
  .seg span { overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .seg .trk { position: relative; height: 4px; border-radius: 2px; background: rgba(241, 230, 207, .14); overflow: hidden; }
  .seg .trk i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--paper); }
  .seg.on { color: var(--paper); }
  .seg:hover { color: var(--paper); }
  .seg:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; border-radius: 3px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .btn {
    height: 38px; display: inline-flex; align-items: center; gap: 7px;
    padding: 0 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--paper);
    font: 650 13px/1 ui-rounded, system-ui, sans-serif; cursor: pointer;
  }
  .btn:hover { background: var(--panel-hi); }
  .btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn.rec.on { border-color: rgba(200, 65, 47, .75); }
  .btn.rec.on .dot { border-radius: 2px; }
  #clock {
    margin-left: auto;
    font: 500 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (max-width: 400px) {
    .btn { padding: 0 11px; }
    .btn span:not(.dot) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #recBadge .dot { animation: none; }
    #intro .disc { transition: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="film" width="1080" height="1920" aria-label="Animated film: the American Revolution from 1765 to 1783, drawn in colored pencil"></canvas>
    <div id="loading" class="veil"><span>Sharpening pencils…</span><div class="track"><i></i></div></div>
    <button id="intro" class="veil" type="button" hidden aria-label="Play the film with sound">
      <span class="go">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3.8c0-.9 1-1.5 1.8-1l13 8.2c.7.5.7 1.5 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z"/></svg></span>
        <span class="hint">Tap to play · sound on</span>
      </span>
    </button>
    <div id="recBadge" hidden><span class="dot"></span><span id="recTime">REC 0.0</span></div>
    <div id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastBtn" type="button" hidden>Save video</button></div>
  </div>
  <div id="bar">
    <div id="timeline" role="group" aria-label="Jump to a scene"></div>
    <div class="row">
      <button id="playBtn" class="btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" fill="currentColor" d="M6 3.8c0-.9 1-1.5 1.8-1l13 8.2c.7.5.7 1.5 0 2L7.8 21.2c-.8.5-1.8-.1-1.8-1z"/></svg>
        <span id="playLabel">Play</span>
      </button>
      <button id="restartBtn" class="btn" type="button" aria-label="Restart from the beginning">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>
        <span>Restart</span>
      </button>
      <button id="recBtn" class="btn rec" type="button" aria-label="Record the film to a video file">
        <span class="dot"></span><span id="recLabel">Record</span>
      </button>
      <output id="clock">0.0 / 80.0</output>
    </div>
  </div>
</div>

<!-- Music engine. cdnjs first; jsDelivr is only a fallback if cdnjs is unreachable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<script>
(() => {
'use strict';

/* =========================================================================
   TIMELINE — the one place to change timing.
   Each scene has a start and end in seconds. `cues` are named moments
   inside a scene, written as a fraction of that scene's length
   (0 = scene start, 1 = scene end). The animation and the music both read
   these, so stretching or moving a scene carries its sounds with it.
   ========================================================================= */
const SCENES = [
  { id: 'colonies',    label: '1765',    start: 0,  end: 11,
    cues: { coast: 2 / 18, names: 7 / 18, ship: 8 / 18, stamp: 14 / 18 } },       // stamp slams down at 8.6s
  { id: 'tea',         label: '1773',    start: 11, end: 22,
    cues: { throws: 2.5 / 16 } },                                                // first chest goes over at 12.7s
  { id: 'lexington',   label: '1775',    start: 22, end: 33,
    cues: { halt: 6 / 16, ready: 7 / 16, aim: 8 / 16, fire: 9.5 / 16, reply: 11 / 16 } },  // volley at 28.5s
  { id: 'declaration', label: 'Jul ’76', start: 33, end: 45,
    cues: { header: 0.04, title: 0.12, preamble: 0.3, truths: 0.44, more: 0.66, sign: 0.71, others: 0.86 } },
  { id: 'delaware',    label: 'Dec ’76', start: 45, end: 57,
    cues: { strokes: 1 / 16, shore: 12 / 16 } },                                 // oars dip every two beats
  { id: 'yorktown',    label: '1781',    start: 57, end: 69,
    cues: { chorus: 16 / 32 } },                                                 // "Yankee Doodle" chorus at 63s
  { id: 'peace',       label: '1783',    start: 69, end: 80,
    cues: { title: 0.3, fade: 0.68 } },                                          // fade to paper from 76.5s
];

// Beats of music written for each scene. The tempo stretches with the scene,
// so phrases always land on scene boundaries.
const MUSIC_BEATS = { colonies: 18, tea: 16, lexington: 16, declaration: 16, delaware: 16, yorktown: 32, peace: 16 };

// Caption card at the foot of each scene: [date line, sentence].
const CAPTIONS = {
  colonies:    ['1765 · The Stamp Act', 'Britain taxes its thirteen American colonies, which have no vote in Parliament.'],
  tea:         ['December 16, 1773 · Boston', 'Protesting a British tax on tea, colonists dump 342 chests into the harbor.'],
  lexington:   ['April 19, 1775 · Lexington & Concord', 'Militia and British troops trade fire — “the shot heard round the world.” The war begins.'],
  declaration: ['July 4, 1776 · Philadelphia', 'Congress adopts the Declaration of Independence.'],
  delaware:    ['December 25, 1776 · Delaware River', 'Washington crosses the icy river by night and wins a surprise victory at Trenton.'],
  yorktown:    ['October 19, 1781 · Yorktown', 'Trapped by American and French forces, the British army surrenders.'],
  peace:       ['September 3, 1783 · Paris', 'The Treaty of Paris ends the war. Britain recognizes the United States.'],
};

const CONFIG = {
  W: 1080, H: 1920,          // canvas pixels (portrait 9:16)
  boilFps: 8,                // line boil: hatching is re-randomised this many times a second
  boilPasses: 3,             // randomised hatch passes per layer that the boil shuffles between
  fadeColor: '#ece0c6',      // colour of the dips between scenes and the end fade (paper)
  dip: [0.3, 0.38],          // seconds of fade out / fade in at each scene change
  posterTime: 8.3,           // frame shown under the Play button
  musicLevel: 1.4,           // overall music volume (1 = unity gain before the limiter)
  recordFps: 30,
  recordVideoBps: 8e6,
  recordTail: 0.8,           // seconds recorded after the end so the last chord rings out
};

/* ------------------------------------------------------------------------ */
const W = CONFIG.W, H = CONFIG.H;
const FILM_END = SCENES[SCENES.length - 1].end;
const sceneById = Object.fromEntries(SCENES.map(s => [s.id, s]));
const cue = (id, name) => { const s = sceneById[id]; return s.start + (s.end - s.start) * s.cues[name]; };
const sceneAt = t => SCENES.find(s => t < s.end) || SCENES[SCENES.length - 1];
const beatOf = id => { const s = sceneById[id], b = (s.end - s.start) / MUSIC_BEATS[id]; return beats => s.start + beats * b; };
const beatLen = id => (sceneById[id].end - sceneById[id].start) / MUSIC_BEATS[id];

/* ========================== small math kit ============================== */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, x) => clamp((x - a) / (b - a || 1e-9));
const smooth = t => t * t * (3 - 2 * t);
const easeOut3 = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeIn2 = t => t * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t));
const easeOutBack = t => { const c = 1.7, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const frac = x => x - Math.floor(x);
const pulse = (t, t0, a, d) => (t < t0 - a || t > t0 + d) ? 0 : t < t0 ? smooth((t - t0 + a) / a) : 1 - smooth((t - t0) / d);
const win = (t, a, b, fi = 0.3, fo = 0.3) => Math.min(smooth(invLerp(a, a + fi, t)), 1 - smooth(invLerp(b - fo, b, t)));

function hash3(a, b = 0, c = 0) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x85ebca77) ^ Math.imul((c | 0) + 0x9e3779b9, 0xc2b2ae3d);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
const rand3 = (a, b, c) => hash3(a, b, c) / 4294967296;
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function vnoise(x, seed = 0) {                                      // smooth value noise, -1..1
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = rand3(i, seed, 7), b = rand3(i + 1, seed, 7);
  return (a + (b - a) * u) * 2 - 1;
}
function vnoise2(x, y, seed = 0) {                                  // 2-D value noise, -1..1
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = rand3(i, j, seed), b = rand3(i + 1, j, seed), c = rand3(i, j + 1, seed), d = rand3(i + 1, j + 1, seed);
  return (lerp(lerp(a, b, u), lerp(c, d, u), v)) * 2 - 1;
}
const fbm = (x, y, seed = 0) => 0.6 * vnoise2(x, y, seed) + 0.3 * vnoise2(x * 2.1, y * 2.1, seed + 1) + 0.1 * vnoise2(x * 4.3, y * 4.3, seed + 2);
// Keyframe track: keys are [time, value, ease?]; ease shapes the segment that ends at that key.
function track(keys) {
  const k = keys.slice().sort((a, b) => a[0] - b[0]);
  return t => {
    if (t <= k[0][0]) return k[0][1];
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) {
        const p = k[i - 1], q = k[i];
        return lerp(p[1], q[1], (q[2] || smooth)(invLerp(p[0], q[0], t)));
      }
    }
    return k[k.length - 1][1];
  };
}
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

/* ------------------------------ colour ---------------------------------- */
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb2hex = c => '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mixCache = new Map();
function mix(a, b, t) {
  const key = a + b + t.toFixed(3);
  let v = mixCache.get(key);
  if (!v) { const A = hex2rgb(a), B = hex2rgb(b); v = rgb2hex(A.map((x, i) => lerp(x, B[i], t))); mixCache.set(key, v); }
  return v;
}
// Scene lighting for figures and props: colours are pulled toward a tint and darkened.
const LIGHTS = {
  day:   { tint: '#f4e2bf', amt: 0.0, dark: 0.0, ink: '#23160e' },
  dawn:  { tint: '#e7b48d', amt: 0.12, dark: 0.04, ink: '#24160f' },
  night: { tint: '#1d2546', amt: 0.42, dark: 0.18, ink: '#0f1224' },
  gold:  { tint: '#e9c07c', amt: 0.1, dark: 0.02, ink: '#26170d' },
};
const lit = (hex, L) => (L.amt || L.dark ? mix(mix(hex, '#000000', L.dark), L.tint, L.amt) : hex);

/* ===================== hatching engine (colored pencil) ================== */
// A style is one pencil: colour, width, alpha. Strokes are split across a few
// groups that are stroked separately so overlaps build up like real pencil.
function styles(defs, groups = 5) {
  return defs.map(([color, width, alpha]) => ({ color, width, alpha, g: Array.from({ length: groups }, () => []) }));
}
// The builders are generators so a layer can be drawn a slice at a time
// between frames; `hatch`/`drawStyles` are the run-to-completion versions.
function* drawStylesG(g, list) {
  for (const s of list) {
    g.strokeStyle = s.color; g.lineWidth = s.width; g.globalAlpha = s.alpha;
    for (const arr of s.g) {
      for (let i0 = 0; i0 < arr.length; i0 += 6000) {
        g.beginPath();
        const i1 = Math.min(arr.length, i0 + 6000);
        for (let i = i0; i < i1; i += 4) { g.moveTo(arr[i], arr[i + 1]); g.lineTo(arr[i + 2], arr[i + 3]); }
        g.stroke();
        if (i1 - i0 > 2000) { g.globalAlpha = 1; yield; g.strokeStyle = s.color; g.lineWidth = s.width; g.globalAlpha = s.alpha; }
      }
    }
  }
  g.globalAlpha = 1;
}
const run = it => { while (!it.next().done); };
const drawStyles = (g, list) => run(drawStylesG(g, list));
function put(style, rng, cx, cy, ang, len) {
  const ex = Math.cos(ang) * len * 0.5, ey = Math.sin(ang) * len * 0.5;
  style.g[(rng() * style.g.length) | 0].push(cx - ex, cy - ey, cx + ex, cy + ey);
}
const any = (rng, arr) => arr[(rng() * arr.length) | 0];

// Walk a jittered grid of short strokes across a box. `pick(x, y, rng)` returns
// the pencil for that spot, or null to leave paper showing.
function* hatchG(rng, box, o, pick) {
  const { angle, gap, lenMin, lenMax, jitter = 0.12, spacing = 0.62, angleAt } = o;
  const dx = Math.cos(angle), dy = Math.sin(angle), nx = -dy, ny = dx;
  let n0 = Infinity, n1 = -Infinity, d0 = Infinity, d1 = -Infinity, count = 0;
  for (const [x, y] of [[box.x0, box.y0], [box.x1, box.y0], [box.x0, box.y1], [box.x1, box.y1]]) {
    const pn = x * nx + y * ny, pd = x * dx + y * dy;
    n0 = Math.min(n0, pn); n1 = Math.max(n1, pn); d0 = Math.min(d0, pd); d1 = Math.max(d1, pd);
  }
  for (let pn = n0 + rng() * gap; pn < n1; pn += gap * (0.8 + 0.4 * rng())) {
    for (let pd = d0 - rng() * lenMax; pd < d1;) {
      const len = lenMin + (lenMax - lenMin) * rng();
      const off = (rng() - 0.5) * gap * 0.8;
      const mx = (pd + len * 0.5) * dx + (pn + off) * nx;
      const my = (pd + len * 0.5) * dy + (pn + off) * ny;
      pd += len * (spacing + 0.45 * rng());
      if (mx < box.x0 || mx > box.x1 || my < box.y0 || my > box.y1) continue;
      const st = pick(mx, my, rng);
      if (!st) continue;
      put(st, rng, mx, my, (angleAt ? angleAt(mx, my) : angle) + (rng() - 0.5) * jitter, len);
    }
    if (++count % 12 === 0) yield;
  }
}
const hatch = (rng, box, o, pick) => run(hatchG(rng, box, o, pick));

// Layered pencil fill: a broad soft wash, the main strokes, then cross-hatching
// that builds up in the dark parts. `tone(x, y)` is 0 (darkest) … 1 (lightest);
// `pal` lists pencils from dark to light.
function* pencilG(g, rng, box, inside, tone, pal, o = {}) {
  const n = pal.length, angle = o.angle ?? -0.93, gap = o.gap ?? 4.4;
  const [l0, l1] = o.len || [10, 20];
  const noise = o.noise ?? 0.22;
  const pickI = (x, y, r) => clamp(Math.floor((tone(x, y) + (r() - 0.5) * noise) * n), 0, n - 1);
  const wash = styles(pal.map(c => [c, o.washWidth ?? 6, o.washAlpha ?? 0.32]), 3);
  const main = styles(pal.map(c => [c, o.width ?? 2.4, o.alpha ?? 0.88]), 5);
  const cross = styles([[o.crossColor || pal[0], o.crossWidth ?? 1.9, o.crossAlpha ?? 0.6]], 4);
  if (o.wash !== false) {
    yield* hatchG(rng, box, { angle, gap: gap * 1.5, lenMin: l0 * 1.7, lenMax: l1 * 1.6, jitter: 0.22, spacing: 0.55 },
      (x, y, r) => (inside(x, y) ? wash[pickI(x, y, r)] : null));
  }
  yield* hatchG(rng, box, { angle, gap, lenMin: l0, lenMax: l1, jitter: o.jitter ?? 0.16, angleAt: o.angleAt },
    (x, y, r) => (inside(x, y) && r() < (o.density ?? 0.985) ? main[pickI(x, y, r)] : null));

// Musket drills. The gun is placed relative to the shoulder; hands hold it at

const gunAt = (b, ang, len = FIG.musket) => ({ b, m: [b[0] + Math.cos(ang) * len, b[1] + Math.sin(ang) * len] });
const onGun = (G, t, off = 0) => { const dx = G.m[0] - G.b[0], dy = G.m[1] - G.b[1], l = Math.hypot(dx, dy); return [G.b[0] + dx * t - dy / l * off, G.b[1] + dy * t + dx / l * off]; };
function carry(P, drill, o = {}) {
  const sh = shoulderOf(P, false), bay = o.bayonet !== false;
  if (drill === 'shoulder') {                    // on the shoulder while marching
    P.gun = { ...gunAt([sh[0] + 9, sh[1] + 52], -Math.PI / 2 - 0.1), bay };
    P.nh = [P.gun.b[0] + 1, P.gun.b[1] + 1]; P.ne = [-1, 0.6];
  } else if (drill === 'ready') {                // held up in front, ready to aim
    P.gun = { ...gunAt([sh[0] + 2, sh[1] + 50], -Math.PI / 2 + 0.36), bay };
    P.nh = onGun(P.gun, 0.2); P.fh = onGun(P.gun, 0.45); P.ne = [-1, 0.5]; P.fe = [-0.3, 1];
  } else if (drill === 'present') {              // levelled at the shoulder
    P.lean += 0.12; P.head += 0.28;
    const s2 = shoulderOf(P, false);
    P.gun = { ...gunAt([s2[0] - 4, s2[1] + 5], o.ang ?? -0.03), bay };
    P.nh = onGun(P.gun, 0.17); P.fh = onGun(P.gun, 0.37); P.ne = [-0.4, 1]; P.fe = [-0.2, 1];
  } else if (drill === 'order') {                // butt on the ground beside the foot
    P.gun = { ...gunAt([P.hip[0] + 17, -2], -Math.PI / 2 + 0.04), bay };
    P.nh = onGun(P.gun, 0.56); P.ne = [-1, 0.2];
  } else if (drill === 'trail') {                // carried low at the side
    P.gun = { ...gunAt([sh[0] - 70, sh[1] + 70], -0.12), bay };
    P.nh = onGun(P.gun, 0.45); P.ne = [-0.5, 1];
  }
  return P;
}

/* ------------------------------ drawing ----------------------------------- */
function capsule(A, B, wa, wb, seg = 3) {
  const dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy) || 1e-6, ux = dx / l, uy = dy / l, nx = -uy, ny = ux;
  const ra = wa / 2, rb = wb / 2, out = [];
  for (let k = 0; k <= 2 * seg; k++) { const a = Math.PI / 2 - k * Math.PI / (2 * seg); out.push([B[0] + (ux * Math.cos(a) + nx * Math.sin(a)) * rb, B[1] + (uy * Math.cos(a) + ny * Math.sin(a)) * rb]); }
  for (let k = 0; k <= 2 * seg; k++) { const a = -Math.PI / 2 + k * Math.PI / (2 * seg); out.push([A[0] + (-ux * Math.cos(a) + nx * Math.sin(a)) * ra, A[1] + (-uy * Math.cos(a) + ny * Math.sin(a)) * ra]); }
  return out;
}
// The half of a limb that faces away from the light.
function shadeSide(A, B, wa, wb, ld) {
  const dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy) || 1e-6;
  let nx = -dy / l, ny = dx / l;
  if (nx * ld[0] + ny * ld[1] > 0) { nx = -nx; ny = -ny; }
  return [[A[0] + nx * wa * 0.05, A[1] + ny * wa * 0.05], [B[0] + nx * wb * 0.05, B[1] + ny * wb * 0.05], [B[0] + nx * wb * 0.52, B[1] + ny * wb * 0.52], [A[0] + nx * wa * 0.52, A[1] + ny * wa * 0.52]];
}
function signedArea(P) { let a = 0; for (let i = 0, j = P.length - 1; i < P.length; j = i++) a += (P[j][0] - P[i][0]) * (P[j][1] + P[i][1]); return a; }

const HEAD = [[-13, -8], [-9, -15], [0, -17.5], [8, -14], [12, -8], [13, -3], [17.5, 2.5], [14, 4.5], [14.5, 7.5], [12.5, 9.5], [13, 12], [10, 15.5], [4, 16.5], [-3, 14], [-9, 9], [-14, 1]];
const HAIR = [[-14, 1], [-13, -8], [-9, -15], [0, -17.5], [6, -15.5], [5, -10.5], [0, -9], [-2, -3], [-4, 4], [-9, 9]];
const QUEUE = [[-13, 3], [-18, 6], [-22, 14], [-21, 17.5], [-16, 12], [-12, 8]];
const BOW = [[-17, 1.5], [-11.5, 2.5], [-12.5, 7.5], [-18, 6.5]];
const HATS = {
  tricorn: { crown: [[-10, -11], [-9, -24], [-2, -27.5], [7, -25.5], [9.5, -11]],
             brim: [[-23, -21], [-18.5, -12], [-10, -9.5], [4, -9.5], [13.5, -11.5], [22, -18.5], [19, -22], [11.5, -15.5], [4, -14.5], [-9, -14.5], [-15.5, -17]],
             lace: [[-23, -21], [-15.5, -17], [-9, -14.5], [4, -14.5], [11.5, -15.5], [19, -22]] },
  round:   { crown: [[-11, -11], [-10.5, -26], [-3, -28], [8.5, -26], [10, -11]],
             brim: [[-22, -8], [-13, -12], [13, -12], [22, -8], [22, -5.5], [13, -8.5], [-13, -8.5], [-22, -5.5]] },
  cap:     { crown: [[-14, -5], [-13, -14], [-4, -20.5], [7, -19], [13, -10], [6, -9.5], [-6, -8.5]], brim: null },
};
const COAT = [[-8, 63], [-13, 50], [-14.5, 32], [-12.5, 14], [-13.5, 2], [-16.5, -14], [-19.5, -32], [-21.5, -46], [-9, -49], [2.5, -45], [6.5, -26], [7.5, -8], [8.5, 6], [9.5, 24], [9, 44], [6.5, 58], [0, 64.5]];
const COAT_SHADE = [[-13.5, 28], [-12.5, 12], [-16.5, -14], [-19.5, -32], [-21.5, -46], [-9, -49], [-6, -24], [-8, 6], [-9.5, 24]];
const VEST = [[6.5, 58], [11, 52.5], [14.5, 38], [14.5, 20], [13.5, 4], [11.5, -13], [4.5, -11], [7, 6], [8, 30]];
const LAPEL = [[0, 64.5], [6.5, 58], [9.5, 50], [9.5, 32], [5.5, 34], [3, 52]];
const COLLAR = [[-8, 63], [-9.5, 69.5], [1, 71], [5, 65], [0, 64.5]];
const BELT = [[0.5, 64], [6.5, 61], [-7.5, 3.5], [-14.5, 8.5]];
const BOX = [[-22.5, 10], [-9.5, 10], [-9.5, -9], [-22.5, -9]];
const CAPE = [[-9, 64], [-19, 50], [-21, 36], [8, 36], [11, 50], [6, 62]];

function drawFigure(g, F, P, tick) {
  const O = OUTFITS[F.outfit], L = F.light || LIGHTS.day, s = F.s, dir = F.dir;
  const ld = L.dir || [-0.55, -0.83];
  const X = p => [F.x + dir * p[0] * s, F.y + p[1] * s];
  const col = c => lit(c, L), farCol = c => mix(lit(c, L), L.ink, 0.26);
  const parts = [];
  const add = (poly, color, o = {}) => { parts.push({ poly, color, ...o }); };
  const limb = (A, B, wa, wb, color, far) => { const a = X(A), b = X(B); add(capsule(a, b, wa * s, wb * s), far ? farCol(color) : col(color), { shade: shadeSide(a, b, wa * s, wb * s, ld) }); };
  const torsoPoly = (pts, skirts) => pts.map(([a, b]) => X(b < 0 && skirts ? tf(P, a + (a < -5 ? P.tails * 5 * (-b / 46) : 0), b, P.lean * 0.3) : tf(P, a, b)));
  const neck = tf(P, 1.5, 62), hRot = P.lean * 0.6 + P.head;
  const headC = add2(neck, rot([2.5, -21], P.lean + P.head * 0.7));
  const H = pts => pts.map(p => X(add2(headC, rot(p, hRot))));

  // Legs and arms (IK).
  const hipN = tf(P, 1, 0), hipF = tf(P, -2, 0);
  const kneeN = ik2(hipN[0], hipN[1], P.nf[0], P.nf[1], FIG.thigh, FIG.shin, 1, -0.1);
  const kneeF = ik2(hipF[0], hipF[1], P.ff[0], P.ff[1], FIG.thigh, FIG.shin, 1, -0.1);
  const shN = shoulderOf(P, false), shF = shoulderOf(P, true);
  const elN = ik2(shN[0], shN[1], P.nh[0], P.nh[1], FIG.upper, FIG.fore, P.ne[0], P.ne[1]);
  const elF = ik2(shF[0], shF[1], P.fh[0], P.fh[1], FIG.upper, FIG.fore, P.fe[0], P.fe[1]);
  const facing = O.facing || O.coat;

  const arm = (sh, el, wr, far) => {
    limb(sh, el, 16, 13.5, O.coat, far);
    limb(el, wr, 13.5, 12, O.coat, far);
    if (O.facing) limb(lerp2(el, wr, 0.5), wr, 16, 15.5, facing, far);
    const u = [wr[0] - el[0], wr[1] - el[1]], l = Math.hypot(u[0], u[1]) || 1;
    limb(wr, add2(wr, u, 6.5 / l), 11, 9, O.skin, far);
  };
  const leg = (hp, kn, an, fa, far) => {
    limb(hp, kn, 21, 16, O.breeches, far);
    if (O.boots) limb(lerp2(kn, an, -0.1), an, 17, 13.5, O.legs, far);
    else {
      limb(kn, an, 15, 10.5, O.legs, far);
      if (O.gaiter) limb(lerp2(kn, an, 0.42), an, 15.5, 12.5, O.gaiter, far);
    }
    const shoe = [[-7, -3], [-8, 5], [17, 7], [20.5, 4], [14, -1.5], [4, -4.5]].map(p => X(add2(an, rot(p, fa))));
    add(shoe, far ? farCol(O.shoes) : col(O.shoes));
  };
  const musket = G => {
    const b = X(G.b), m = X(G.m), dx = m[0] - b[0], dy = m[1] - b[1], len = Math.hypot(dx, dy), u = [dx / len, dy / len];
    let n = [-u[1], u[0]]; if (n[1] < 0 || (Math.abs(n[1]) < 0.2 && n[0] * dir < 0)) n = [-n[0], -n[1]];
    const Q = (t, o) => [b[0] + u[0] * len * t + n[0] * o * s, b[1] + u[1] * len * t + n[1] * o * s];
    add([Q(0, -5.5), Q(0.3, -2.4), Q(0.88, -2.2), Q(0.88, 2), Q(0.37, 2.6), Q(0.3, 4.8), Q(0.23, 3), Q(0.11, 6.5), Q(0, 9)], col('#6d4424'), { shade: [Q(0, 2), Q(0.3, 0.6), Q(0.88, 0.4), Q(0.88, 2), Q(0.37, 2.6), Q(0.3, 4.8), Q(0.23, 3), Q(0.11, 6.5), Q(0, 9)] });
    add([Q(0.25, -3.6), Q(1, -3.1), Q(1, -0.7), Q(0.25, -0.7)], col('#70767b'));
    add([Q(0.27, -1), Q(0.35, -1), Q(0.35, 2.4), Q(0.27, 2.4)], col('#3c3a36'));
    if (G.bay) add([Q(0.965, -4.4), Q(1.245, -3.7), Q(1.25, -3.3), Q(0.965, -2.6)], col('#a4a9ab'), { line: 0.7 });
  };

  // Back to front.
  if (O.cloak) {
    const fl = F.flutter || 0;
    add(torsoPoly([[-6, 66], [-18, 58], [-30 - 8 * fl, 36], [-44 - 14 * fl, 6], [-50 - 16 * fl, -26], [-40 - 10 * fl, -50], [-22, -44], [-12, -30], [-4, 0], [4, 40], [6, 62]]), mix(col(O.cloak), L.ink, 0.12), { shade: torsoPoly([[-30 - 8 * fl, 36], [-44 - 14 * fl, 6], [-50 - 16 * fl, -26], [-40 - 10 * fl, -50], [-26, -36]]) });
  }
  if (!F.hideFarArm) arm(shF, elF, P.fh, true);
  if (!F.seatedHide) leg(hipF, kneeF, P.ff, P.ffa, true);
  add(torsoPoly(VEST, true), col(O.vest));
  add(torsoPoly(COAT, true), col(O.coat), { shade: torsoPoly(COAT_SHADE, true) });
  if (O.cape) add(torsoPoly(CAPE), mix(col(O.coat), '#ffffff', 0.08), { shade: torsoPoly([[-19, 50], [-21, 36], [-4, 36], [-8, 48]]) });
  if (O.facing) { add(torsoPoly(LAPEL), col(facing)); add(torsoPoly(COLLAR), col(facing)); }
  if (O.belt) add(torsoPoly(BELT), col(O.belt), { line: 0.8 });
  if (O.box) add(torsoPoly(BOX), col(O.box));
  if (!F.seatedHide) leg(hipN, kneeN, P.nf, P.nfa, false);
  // Neck, stock and head.
  limb(tf(P, 0, 56), add2(headC, rot([-1, 10], hRot)), 13, 12, O.skin, false);
  add(capsule(X(tf(P, -2, 62)), X(tf(P, 5, 64.5)), 12 * s, 12 * s), col(O.stock), { line: 0.8 });
  add(H(HEAD), col(O.skin), { shade: H([[-14, 1], [-9, 9], [-3, 14], [4, 16.5], [3, 11], [-5, 5], [-8, -2]]) });
  add(H(HAIR), col(O.hair), { shade: H([[-14, 1], [-9, 9], [-4, 4], [-8, 0]]) });
  if (F.outfit !== 'colonistC' && O.hat !== 'cap') { add(H(QUEUE), col(O.hair)); add(H(BOW), col('#1b1714')); }
  const ear = []; for (let k = 0; k < 8; k++) ear.push([-1.5 + Math.cos(k / 8 * TAU) * 3, 1 + Math.sin(k / 8 * TAU) * 4.5]);
  add(H(ear), mix(col(O.skin), L.ink, 0.12), { line: 0.7 });
  const hat = HATS[O.hat];
  if (hat) {
    add(H(hat.crown), col(O.hatCol));
    if (hat.brim) add(H(hat.brim), col(O.hatCol));
  }
  if (P.gun && !P.gunFront) musket(P.gun);
  if (P.sword) {
    const hnd = P.nh, a = P.sword.ang, b0 = add2(hnd, [Math.cos(a) * 4, Math.sin(a) * 4]), b1 = add2(hnd, [Math.cos(a) * 84, Math.sin(a) * 84]);
    add(capsule(X(b0), X(b1), 3.4 * s, 1.2 * s, 1), col('#b9bec0'), { line: 0.7 });
    add(capsule(X(add2(hnd, [Math.cos(a + 1.57) * 6, Math.sin(a + 1.57) * 6])), X(add2(hnd, [Math.cos(a - 1.57) * 6, Math.sin(a - 1.57) * 6])), 3 * s, 3 * s, 1), col('#c9a55a'));
  }
  if (!F.hideNearArm) arm(shN, elN, P.nh, false);
  if (P.gun && P.gunFront) musket(P.gun);

  // Paint: flat colour, shadow cross-hatch, sketchy outline; then pencil grain over everything.
  const U = new Path2D(), ink = L.ink, lw = 2.2;
  const shadePat = pat('shade', tick, F.seed), rng = mulberry32(hash3(tick, F.seed, 5));
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const pt of parts) {
    if (signedArea(pt.poly) < 0) pt.poly.reverse();
    g.fillStyle = pt.color; g.beginPath(); polyPath(g, pt.poly); g.fill();
    polyPath(U, pt.poly);
    if (pt.shade) {
      g.globalCompositeOperation = 'multiply'; g.fillStyle = shadePat; g.globalAlpha = 0.9;
      g.beginPath(); polyPath(g, pt.shade); g.fill();
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    }
    if (pt.line !== 0) {
      g.strokeStyle = ink; g.lineWidth = lw * (pt.line || 1); g.globalAlpha = 0.9; g.beginPath();
      pt.poly.forEach(([x, y], i) => { const X2 = x + (rng() - 0.5) * 1.3, Y2 = y + (rng() - 0.5) * 1.3; i ? g.lineTo(X2, Y2) : g.moveTo(X2, Y2); });
      g.closePath(); g.stroke(); g.globalAlpha = 1;
    }
  }
  g.globalCompositeOperation = 'multiply'; g.fillStyle = pat('grain', tick, F.seed + 3); g.fill(U);
  g.globalCompositeOperation = 'source-over'; g.fillStyle = pat('lift', tick, F.seed + 7); g.fill(U);
  // Face details and trims on top.
  const hp = p => X(add2(headC, rot(p, hRot)));
  g.strokeStyle = ink; g.lineWidth = 2.2; g.beginPath();
  let e0 = hp([8, -3.2]), e1 = hp([10.8, -3]); g.moveTo(e0[0], e0[1]); g.lineTo(e1[0], e1[1]);
  e0 = hp([6.5, -6.5]); e1 = hp([12, -6.8]); g.moveTo(e0[0], e0[1]); g.lineTo(e1[0], e1[1]);
  g.stroke();
  g.strokeStyle = mix(ink, '#a0402e', 0.5); g.lineWidth = 1.6; g.beginPath();
  e0 = hp([11.5, 9]); e1 = hp([14, 8.8]); g.moveTo(e0[0], e0[1]); g.lineTo(e1[0], e1[1]); g.stroke();
  if (hat && O.lace) sketchLine(g, H(hat.lace), rng, 0.8, col(O.lace), 2.2, 0.95);
  if (O.button) {
    g.fillStyle = col(O.button);
    for (const b of [50, 42, 34, 26, 18]) { const p = X(tf(P, 8.3, b)); g.beginPath(); g.arc(p[0], p[1], 1.9 * s, 0, TAU); g.fill(); }
  }
  if (O.gaiter && !F.seatedHide) {
    g.fillStyle = col('#8d8a84');
    for (const [kn, an] of [[kneeN, P.nf]]) for (const t of [0.52, 0.66, 0.8]) { const p = X(lerp2(kn, an, t)); g.beginPath(); g.arc(p[0] + dir * 5.5 * s, p[1], 1.5 * s, 0, TAU); g.fill(); }
  }
  return { headC: X(headC), hand: X(P.nh), farHand: X(P.fh), muzzle: P.gun ? X(P.gun.m) : null };
}

/* ------------------------------- flags ------------------------------------- */
const FLAG_W = 390, FLAG_H = 256;
function* flagBuild(g, rng, kind) {
  const w = FLAG_W, h = FLAG_H, box = { x0: 0, y0: 0, x1: w, y1: h };
  const RED = ['#7e1e1c', '#9b2a24', '#b3382d', '#c44b3b'], WHITE = ['#c9c2b2', '#ddd6c6', '#ece6d8', '#f6f1e6'], BLUE = ['#152046', '#1e2c5a', '#28386c', '#344680'];
  const stripe = y => Math.floor(y / (h / 13));
  const tone = (x, y) => 0.55 + 0.35 * Math.sin(x * 0.02 + y * 0.004) + 0.1 * vnoise2(x * 0.03, y * 0.03, 4);
  if (kind === 'us' || kind === 'union') {
    const cw = w * 0.42, ch = h * 7 / 13;
    const inCanton = (x, y) => x < cw && y < ch;
    yield* pencilG(g, rng, box, (x, y) => !inCanton(x, y) && stripe(y) % 2 === 0, tone, RED, { gap: 3.4, len: [7, 13], washAlpha: 0.4 });
    yield* pencilG(g, rng, box, (x, y) => !inCanton(x, y) && stripe(y) % 2 === 1, tone, WHITE, { gap: 3.8, len: [7, 13], cross: false });
    if (kind === 'us') {
      yield* pencilG(g, rng, { x0: 0, y0: 0, x1: cw, y1: ch }, () => true, (x, y) => tone(x, y) * 0.8, BLUE, { gap: 3.2, len: [7, 12], washAlpha: 0.45 });
      g.fillStyle = '#f5f0e2';
      for (let i = 0; i < 13; i++) {
        const a = -Math.PI / 2 + i * TAU / 13, cx = cw / 2 + Math.cos(a) * ch * 0.34, cy = ch / 2 + Math.sin(a) * ch * 0.34;
        g.beginPath();
        for (let k = 0; k < 10; k++) { const r = k % 2 ? 4.2 : 10.5, b = a + k * Math.PI / 5; g.lineTo(cx + Math.cos(b) * r, cy + Math.sin(b) * r); }
        g.closePath(); g.globalAlpha = 0.95; g.fill();
      }
      g.globalAlpha = 1;
    } else {
      // The 1606 Union: St Andrew's white saltire and St George's red cross on blue.
      yield* pencilG(g, rng, { x0: 0, y0: 0, x1: cw, y1: ch }, () => true, (x, y) => tone(x, y) * 0.8, BLUE, { gap: 3.2, len: [7, 12] });
      g.save(); g.beginPath(); g.rect(0, 0, cw, ch); g.clip();
      g.strokeStyle = '#f2ede0'; g.lineWidth = ch * 0.2; g.beginPath(); g.moveTo(0, 0); g.lineTo(cw, ch); g.moveTo(cw, 0); g.lineTo(0, ch); g.stroke();
      g.fillStyle = '#f2ede0'; g.fillRect(cw / 2 - ch * 0.17, 0, ch * 0.34, ch); g.fillRect(0, ch / 2 - ch * 0.17, cw, ch * 0.34);
      g.fillStyle = '#b3382d'; g.fillRect(cw / 2 - ch * 0.1, 0, ch * 0.2, ch); g.fillRect(0, ch / 2 - ch * 0.1, cw, ch * 0.2);
      g.restore();
      const S = styles([['#8a2a22', 1.6, 0.5], ['#a8a090', 1.5, 0.45]], 2);
      hatch(rng, { x0: 0, y0: 0, x1: cw, y1: ch }, { angle: -0.93, gap: 4, lenMin: 6, lenMax: 11 }, (x, y, r) => (r() < 0.5 ? S[r() < 0.5 ? 0 : 1] : null));
      g.save(); g.beginPath(); g.rect(0, 0, cw, ch); g.clip(); drawStyles(g, S); g.restore();
    }
    // Stripe seams.
    g.strokeStyle = 'rgba(90,30,24,0.45)'; g.lineWidth = 1.4; g.beginPath();
    for (let k = 1; k < 13; k++) { const y = k * h / 13; g.moveTo(k < 7 ? cw : 0, y); g.lineTo(w, y); }
    g.stroke();
  } else {
    // French royal white, with a scatter of gold lilies.
    yield* pencilG(g, rng, box, () => true, tone, WHITE, { gap: 3.8, len: [7, 13], crossAmt: 0.5 });
    g.fillStyle = '#c9a44a'; g.globalAlpha = 0.9;
    for (const [fx, fy] of [[0.25, 0.3], [0.62, 0.28], [0.44, 0.68], [0.82, 0.66]]) {
      const x = fx * w, y = fy * h;
      g.beginPath(); g.ellipse(x, y - 9, 4, 11, 0, 0, TAU); g.ellipse(x - 9, y - 1, 3.5, 8, -0.8, 0, TAU); g.ellipse(x + 9, y - 1, 3.5, 8, 0.8, 0, TAU); g.rect(x - 9, y + 2, 18, 4); g.fill();
    }
    g.globalAlpha = 1;

  const fifeVib = new T.Vibrato({ frequency: 5.6, depth: 0.09 });
  const fife = new T.PolySynth(T.Synth, { oscillator: { type: 'custom', partials: [1, 0.32, 0.14, 0.06, 0.025] }, envelope: { attack: 0.025, decay: 0.12, sustain: 0.78, release: 0.08 } });

  const chiff = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.003, decay: 0.045, sustain: 0, release: 0.02 } });
  const chiffF = new T.Filter({ type: 'bandpass', frequency: 3400, Q: 1.1 }); chiff.connect(chiffF); route(chiffF, 0.55, 0.12); chiff.volume.value = -31;
  // Field drum: rattly snares over a short tuned body.
  const snN = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.12, sustain: 0, release: 0.03 } });
  const snHP = new T.Filter({ type: 'highpass', frequency: 1100 }), snPk = new T.Filter({ type: 'peaking', frequency: 3600, Q: 0.9, gain: 5 });
  snN.chain(snHP, snPk); route(snPk, 0.85, 0.25); snN.volume.value = -15;
  const snB = new T.MembraneSynth({ pitchDecay: 0.012, octaves: 2, envelope: { attack: 0.001, decay: 0.07, sustain: 0, release: 0.02 } });
  route(snB, 0.7, 0.2); snB.volume.value = -19;
  const bd = new T.MembraneSynth({ pitchDecay: 0.05, octaves: 3, envelope: { attack: 0.002, decay: 0.42, sustain: 0, release: 0.1 } });
  route(bd, 1, 0.22); bd.volume.value = -8;
  // Strings (pad) and a separate low drone.
  const strF = new T.Filter({ type: 'lowpass', frequency: 1500, Q: 0.5 });
  const strings = new T.PolySynth(T.Synth, { oscillator: { type: 'fatsawtooth', count: 3, spread: 22 }, envelope: { attack: 0.55, decay: 0.3, sustain: 0.85, release: 1.3 } });
  strings.connect(strF); route(strF, 0.75, 0.5); strings.volume.value = -16;
  const drF = new T.Filter({ type: 'lowpass', frequency: 420, Q: 0.7 });
  const drone = new T.PolySynth(T.Synth, { oscillator: { type: 'fatsawtooth', count: 3, spread: 16 }, envelope: { attack: 1.2, decay: 0.2, sustain: 1, release: 1.2 } });
  drone.connect(drF); route(drF, 0.85, 0.35); drone.volume.value = -17;
  // Soft horns.
  const brF = new T.Filter({ type: 'lowpass', frequency: 1700, Q: 1 });
  const brass = new T.PolySynth(T.Synth, { oscillator: { type: 'fatsawtooth', count: 2, spread: 9 }, envelope: { attack: 0.08, decay: 0.3, sustain: 0.72, release: 0.55 } });
  brass.connect(brF); route(brF, 0.8, 0.38); brass.volume.value = -14;
  // Glockenspiel and a church bell.
  const glock = route(new T.PolySynth(T.FMSynth, {
    harmonicity: 4, modulationIndex: 1.6, oscillator: { type: 'sine' }, modulation: { type: 'sine' },
    envelope: { attack: 0.002, decay: 1.2, sustain: 0, release: 1.1 }, modulationEnvelope: { attack: 0.002, decay: 0.3, sustain: 0, release: 0.3 },
  }), 0.75, 0.5);
  glock.volume.value = -19;
  const bell = route(new T.PolySynth(T.FMSynth, {
    harmonicity: 1.41, modulationIndex: 9, oscillator: { type: 'sine' }, modulation: { type: 'sine' },
    envelope: { attack: 0.002, decay: 4, sustain: 0, release: 3 }, modulationEnvelope: { attack: 0.002, decay: 1.6, sustain: 0, release: 1 },
  }), 0.7, 0.7);
  bell.volume.value = -16;
  // Plucked bass.
  const pluck = route(new T.PolySynth(T.MonoSynth, {
    oscillator: { type: 'sawtooth' }, filter: { type: 'lowpass', Q: 1.2, rolloff: -24 },
    envelope: { attack: 0.003, decay: 0.35, sustain: 0, release: 0.25 },
    filterEnvelope: { attack: 0.002, decay: 0.12, sustain: 0.12, release: 0.2, baseFrequency: 150, octaves: 3.2, exponent: 2 },
  }), 0.95, 0.22);
  pluck.volume.value = -11;
  // Musket shots, cannon-like boom.
  const shotN = new T.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.12 } });
  const shotF = new T.Filter({ type: 'lowpass', frequency: 2600, Q: 0.6 }); shotN.connect(shotF); route(shotF, 1, 0.6); shotN.volume.value = -3;
  const boom = new T.MembraneSynth({ pitchDecay: 0.08, octaves: 4, envelope: { attack: 0.002, decay: 0.8, sustain: 0, release: 0.2 } });
  route(boom, 1, 0.45); boom.volume.value = -5;
  // Water, whoosh, quill, clicks: short filtered noise.
  const spN = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.004, decay: 0.42, sustain: 0, release: 0.1 } });
  const spF = new T.Filter({ type: 'lowpass', frequency: 3000, Q: 0.8 }); spN.connect(spF); route(spF, 0.9, 0.35); spN.volume.value = -13;
  const plop = new T.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.002, decay: 0.12, sustain: 0, release: 0.05 } });
  route(plop, 0.9, 0.3); plop.volume.value = -9;
  const whN = new T.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.08, decay: 0.2, sustain: 0, release: 0.08 } });
  const whF = new T.Filter({ type: 'bandpass', frequency: 600, Q: 1.4 }); whN.connect(whF); route(whF, 0.8, 0.3); whN.volume.value = -16;
  const qN = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.006, decay: 0.06, sustain: 0, release: 0.02 } });
  const qF = new T.Filter({ type: 'bandpass', frequency: 4300, Q: 2.6 }); qN.connect(qF); route(qF, 0.8, 0.12); qN.volume.value = -22;
  const ck = new T.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.022, sustain: 0, release: 0.01 } });
  const ckF = new T.Filter({ type: 'bandpass', frequency: 2800, Q: 1.8 }); ck.connect(ckF); route(ckF, 0.9, 0.2); ck.volume.value = -14;
  const knock = new T.MembraneSynth({ pitchDecay: 0.01, octaves: 1.6, envelope: { attack: 0.001, decay: 0.09, sustain: 0, release: 0.03 } });
  route(knock, 0.9, 0.25); knock.volume.value = -12;
  // Continuous textures: wind and harbour water.
  const wind = new T.Noise('pink'), windF = new T.Filter({ type: 'bandpass', frequency: 520, Q: 0.9 }), windG = new T.Gain(0);
  const windL = new T.LFO(0.11, 320, 980); windL.connect(windF.frequency); windL.start();
  wind.chain(windF, windG); route(windG, 0.9, 0.3);
  const harb = new T.Noise('brown'), harbF = new T.Filter({ type: 'lowpass', frequency: 360, Q: 0.6 }), harbG = new T.Gain(0);
  harb.chain(harbF, harbG); route(harbG, 0.9, 0.2);
  const bird = new T.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.005, decay: 0.08, sustain: 0.3, release: 0.04 } });
  route(bird, 0.5, 0.4); bird.volume.value = -24;
  const loop = (src, g, key, time, into, dur, level) => {
    const rem = dur - into; if (rem <= 0.05) return;
    g.gain.cancelScheduledValues(time); g.gain.setValueAtTime(into > 0 ? level : 0, time);
    if (!(into > 0)) g.gain.linearRampToValueAtTime(level, time + 1.2);
    g.gain.setValueAtTime(level, time + Math.max(0.01, rem - 1.2)); g.gain.linearRampToValueAtTime(0, time + rem);
    time = after(key, time); src.start(time); src.stop(time + rem + 0.05);
  };

  const N = {
    out, master,
    fife(note, time, dur, vel = 0.6) {
      fife.triggerAttackRelease(note, dur, time, vel);
      chiff.triggerAttackRelease(0.03, after('chiff', time), vel * 0.8);
    },
    snare(time, v = 0.5) { time = after('sn', time); snN.triggerAttackRelease(0.1, time, v); snB.triggerAttackRelease('E3', 0.05, time, v * 0.7); },
    bd(time, v = 0.6, note = 'D2') { bd.triggerAttackRelease(note, 0.3, after('bd', time), v); },
    str(notes, time, dur, vel = 0.4) { strings.triggerAttackRelease(notes, dur, time, vel); },
    strOn(notes, time, into, dur, vel) { const rem = dur - into; if (rem > 0.05) strings.triggerAttackRelease(notes, rem, time, vel); },
    droneOn(notes, time, into, dur, vel = 0.5) { const rem = dur - into; if (rem > 0.05) drone.triggerAttackRelease(notes, rem, time, vel); },
    brass(notes, time, dur, vel = 0.5) { brass.triggerAttackRelease(notes, dur, time, vel); },
    glock: (note, time, vel = 0.4, dur = 1) => glock.triggerAttackRelease(note, dur, time, vel),
    bell: (note, time, vel = 0.5, dur = 3) => bell.triggerAttackRelease(note, dur, time, vel),
    pz: (note, time, vel = 0.7, dur = 0.3) => pluck.triggerAttackRelease(note, dur, time, vel),
    volley(time, n, spread, v) {
      for (let k = 0; k < n; k++) shotN.triggerAttackRelease(0.22, after('shot', time + spread * (k / n) + 0.01 * rnd()), v * (0.8 + 0.2 * rnd()));
      boom.triggerAttackRelease('A1', 0.5, after('boom', time), v);
    },
    thunk(time) { boom.triggerAttackRelease('D2', 0.2, after('boom', time), 0.9); knock.triggerAttackRelease('G2', 0.08, after('knock', time), 0.9); shotN.triggerAttackRelease(0.08, after('shot', time), 0.35); },
    splash(time, v = 0.6) {
      time = after('sp', time);
      spF.frequency.setValueAtTime(4200, time); spF.frequency.exponentialRampToValueAtTime(420, time + 0.4);
      spN.triggerAttackRelease(0.34, time, v);
      plop.triggerAttackRelease(420, 0.1, time, v); plop.frequency.setValueAtTime(420, time); plop.frequency.exponentialRampToValueAtTime(140, time + 0.1);
    },
    whoosh(time, v = 0.5) { time = after('wh', time); whF.frequency.setValueAtTime(380, time); whF.frequency.exponentialRampToValueAtTime(1900, time + 0.3); whN.triggerAttackRelease(0.22, time, v); },
    quill(time, v = 0.3) { time = after('q', time); qF.frequency.setValueAtTime(3600 + 1600 * rnd(), time); qN.triggerAttackRelease(0.03 + 0.05 * rnd(), time, v); },
    click(time, v = 0.5) { time = after('ck', time); ckF.frequency.setValueAtTime(2200 + 2400 * rnd(), time); ck.triggerAttackRelease(0.015, time, v); },
    clatter(time, v = 0.6) { for (let k = 0; k < 4; k++) N.click(time + k * 0.03 + 0.01 * rnd(), v * (1 - k * 0.18)); knock.triggerAttackRelease('A2', 0.06, after('knock', time), v); },
    windOn(time, into, dur) {
      loop(wind, windG, 'wind', time, into, dur, 0.22);
      for (let k = Math.ceil(into / 2.2); k * 2.2 < dur - 1; k++) { const at = time + k * 2.2 - into; if (at > time) { windG.gain.setValueAtTime(0.22, at); windG.gain.linearRampToValueAtTime(0.34 + 0.1 * Math.sin(k), at + 1); windG.gain.linearRampToValueAtTime(0.22, at + 2.1); } }
    },
    harbourOn(time, into, dur) { loop(harb, harbG, 'harb', time, into, dur, 0.5); },
    chirp(time) {
      const f0 = 2600 + 900 * rnd();
      bird.triggerAttackRelease(f0, 0.11, after('bird', time), 0.5);
      bird.frequency.setValueAtTime(f0, time); bird.frequency.exponentialRampToValueAtTime(f0 * 1.5, time + 0.05); bird.frequency.exponentialRampToValueAtTime(f0 * 1.1, time + 0.1);
    },
    fadeOut(time, into, dur) {
      const p0 = clamp(into / dur), rem = Math.max(0.05, dur - into);
      master.gain.cancelScheduledValues(time);
      master.gain.setValueAtTime(LEVEL * (1 - p0), time);
      master.gain.linearRampToValueAtTime(LEVEL * (1 - p0) * 0.45, time + rem * 0.6);
      master.gain.linearRampToValueAtTime(0, time + rem);
    },
    silence() {
      const now = T.now();
      for (const s of [fife, strings, drone, brass, glock, bell, pluck]) s.releaseAll(now);
      for (const src of [wind, harb]) { try { if (src.state === 'started') src.stop(now); } catch (e) { /* already stopped */ } }
      for (const p of [windG.gain, harbG.gain, master.gain]) p.cancelScheduledValues(now);
      windG.gain.setValueAtTime(0, now); harbG.gain.setValueAtTime(0, now); master.gain.setValueAtTime(LEVEL, now);
    },
  };
  N.ready = reverb.ready || Promise.resolve();
  return N;
}

// The score, written against the same SCENES/cues the animation uses.
function buildScore(N) {
  const ev = [];
  const one = (t, fn) => ev.push({ t, fn, dur: 0, sustain: false });
  const hold = (t, dur, fn) => ev.push({ t, fn, dur, sustain: true });
  const fife = (t, note, dur, vel = 0.6) => one(t, time => N.fife(note, time, dur * 0.9, vel));
  const pz = (t, note, vel = 0.7, dur = 0.3) => one(t, time => N.pz(note, time, vel, dur));
  const glock = (t, note, vel = 0.4, dur = 1) => one(t, time => N.glock(note, time, vel, dur));
  const sn = (t, v) => one(t, time => N.snare(time, v));
  const flam = (t, v) => { sn(t - 0.028, v * 0.45); sn(t, v); };
  const roll = (t0, t1, v0, v1, rate = 0.045) => { for (let t = t0; t < t1 - 1e-3; t += rate) sn(t, lerp(v0, v1, invLerp(t0, t1, t))); };
  const bd = (t, v, note) => one(t, time => N.bd(time, v, note));
  const strH = (t, dur, notes, vel) => hold(t, dur, (time, into) => N.strOn(notes, time, into, dur, vel));
  const mel = (B, list, vel, oct = 0) => { for (const [b, n, d] of list) fife(B(b), oct ? window.Tone.Frequency(n).transpose(12 * oct).toNote() : n, d * (B(1) - B(0)), vel); };

  // 1765 — drum roll, the fife tune, the colony names on the glockenspiel, then the Stamp Act.
  {
    const id = 'colonies', B = beatOf(id), b = beatLen(id), s = sceneById[id];
    roll(B(0) + 0.05, B(2) - 0.05, 0.1, 0.6, b / 8);
    bd(B(2), 0.75);
    const tune = [[2, 'A4', 0.5], [2.5, 'D5', 0.5], [3, 'F#5', 0.5], [3.5, 'A5', 0.5], [4, 'G5', 0.5], [4.5, 'F#5', 0.5], [5, 'E5', 0.5], [5.5, 'D5', 0.5],
      [6, 'E5', 0.5], [6.5, 'F#5', 0.5], [7, 'G5', 0.5], [7.5, 'E5', 0.5], [8, 'F#5', 1], [9, 'D5', 1],
      [10, 'A4', 0.5], [10.5, 'D5', 0.5], [11, 'F#5', 0.5], [11.5, 'A5', 0.5], [12, 'B5', 0.5], [12.5, 'A5', 0.5], [13, 'G5', 0.5], [13.5, 'F#5', 0.5]];
    mel(B, tune, 0.62);
    for (const [bb, n] of [[4, 'A5'], [8, 'G5'], [12, 'C#6']]) fife(B(bb) - b / 8, n, b / 9, 0.4);            // grace notes
    ['G6', 'E6', 'F#6', 'A6', 'D6', 'F#6', 'A5', 'D6', 'F#6', 'A6', 'B6', 'A6', 'G6'].forEach((n, k) => glock(COL.nameT[k], n, 0.42, 0.9));
    for (let bb = 2; bb < 14; bb++) { if (bb % 2 === 0) flam(B(bb), 0.55); else sn(B(bb), 0.45); sn(B(bb + 0.5), 0.22); }
    roll(B(9.5), B(10) - 0.02, 0.25, 0.5, b / 8); roll(B(13.5), B(14) - 0.02, 0.25, 0.6, b / 8);
    for (let bb = 4; bb < 14; bb += 2) bd(B(bb), 0.5);
    [['D3', 'A2'], ['G2', 'D3'], ['A2', 'E3'], ['D3', 'A2'], ['D3', 'F#3'], ['G2', 'D3']].forEach(([r5, f5], k) => { pz(B(2 + 2 * k), r5, 0.7); pz(B(3 + 2 * k), f5, 0.55); });
    strH(B(2), B(8) - B(2), ['D3', 'A3', 'F#4'], 0.22);
    strH(B(8), B(14) - B(8) - 0.1, ['D3', 'A3', 'D4'], 0.2);
    // The stamp.
    one(COL.T.stamp, time => N.thunk(time)); bd(COL.T.stamp, 1, 'A1');
    strH(COL.T.stamp, s.end - COL.T.stamp + 0.4, ['D3', 'F3', 'A3', 'D4'], 0.4);
    ['D2', 'C3', 'Bb2', 'A2'].forEach((n, k) => pz(B(14 + k), n, 0.85, 0.5));
    sn(B(16), 0.2); sn(B(17), 0.25);
  }
  // 1773 — a sneaking pizzicato in D minor; whooshes and splashes as the chests go over.
  {
    const id = 'tea', B = beatOf(id), b = beatLen(id), s = sceneById[id];
    hold(s.start, s.end - s.start, (time, into) => N.harbourOn(time, into, s.end - s.start));
    const bars = [['D3', 'A2', 'D3', 'F3'], ['E3', 'A2', 'C#3', 'E3'], ['D3', 'A2', 'D3', 'F3'], ['G3', 'D3', 'Bb2', 'D3'], ['F3', 'D3', 'A2', 'D3'], ['Bb2', 'F3', 'D3', 'F3'], ['A2', 'E3', 'C#3', 'E3'], ['D3', 'A2', 'D2', null]];
    bars.forEach((bar, k) => bar.forEach((n, j) => { if (n) pz(B(2 * k + 0.5 * j), n, j ? 0.5 : 0.68, 0.22); }));
    mel(B, [[4, 'A4', 0.5], [4.5, 'D5', 0.5], [5, 'E5', 0.5], [5.5, 'F5', 0.5], [6, 'G5', 0.5], [6.5, 'F5', 0.5], [7, 'E5', 0.5], [7.5, 'D5', 0.5],
      [8, 'F5', 0.5], [8.5, 'E5', 0.5], [9, 'D5', 0.5], [9.5, 'A4', 0.5], [10, 'Bb4', 0.5], [10.5, 'D5', 0.5], [11, 'F5', 0.5], [11.5, 'D5', 0.5],
      [12, 'E5', 0.5], [12.5, 'C#5', 0.5], [13, 'A4', 0.5], [13.5, 'C#5', 0.5], [14, 'D5', 1.5]], 0.42);
    for (let bb = 0; bb < 16; bb++) sn(B(bb + 0.5), 0.14);
    strH(B(8), B(16) - B(8) - 0.2, ['D3', 'A3', 'F4'], 0.18);
    for (const c of TEA.chests) { one(c.r - 0.05, time => N.whoosh(time, 0.5)); one(c.land, time => N.splash(time, 0.7)); }
    pz(B(15.5), 'D2', 0.8, 0.6);
  }
  // 1775 — march in, halt… make ready… present… FIRE. The reply. A lament.
  {
    const id = 'lexington', B = beatOf(id), b = beatLen(id), T = LEX.T;
    for (let bb = 0; bb < 6; bb++) { flam(B(bb), 0.55); sn(B(bb + 0.5), 0.3); sn(B(bb + 0.75), 0.22); if (bb % 2 === 0) { bd(B(bb), 0.65); pz(B(bb), 'D2', 0.6, 0.4); } }
    mel(B, [[0, 'D5', 1], [1, 'F5', 0.5], [1.5, 'E5', 0.5], [2, 'D5', 0.5], [2.5, 'C5', 0.5], [3, 'A4', 1], [4, 'Bb4', 0.5], [4.5, 'A4', 0.5], [5, 'G4', 0.5], [5.5, 'E4', 0.5]], 0.58);
    flam(T.halt, 0.75); bd(T.halt, 0.8); fife(T.halt, 'D4', b * 0.6, 0.45);
    strH(T.halt + 0.1, T.fire - T.halt - 0.15, ['A2', 'E3'], 0.34);
    LEX.reds.forEach((r, k) => { one(T.ready + r.j + 0.05 + k * 0.03, time => N.click(time, 0.55)); one(T.ready + r.j + 0.2 + k * 0.03, time => N.click(time, 0.45)); });

    one(T.fire, time => N.volley(time, 7, 0.09, 1));
    one(T.fire + 0.42, time => N.volley(time, 3, 0.06, 0.28));
    LEX.militia.forEach(m => one(T.reply + m.j, time => N.volley(time, 1, 0, 0.8)));
    strH(T.reply + 0.3, sceneById[id].end - T.reply + 0.2, ['D3', 'F3', 'A3', 'D4'], 0.36);
    mel(B, [[12, 'A4', 1], [13, 'D5', 1], [14, 'F5', 1.5], [15.5, 'E5', 0.5]], 0.45);
    for (const bb of [12, 14]) { sn(B(bb), 0.25); sn(B(bb) + 0.06, 0.2); sn(B(bb) + 0.12, 0.3); }
    pz(B(12), 'D2', 0.6, 0.8); pz(B(14), 'Bb1', 0.55, 0.8);
  }
  // July 1776 — a bell, a hymn, the scratch of the quill, and a flourish.
  {
    const id = 'declaration', B = beatOf(id), b = beatLen(id), s = sceneById[id];
    DEC.layout(ctx);
    one(B(0) + 0.02, time => N.bell('D3', time, 0.8, 4)); one(B(8), time => N.bell('D3', time, 0.55, 4));
    const ch = [[0, ['D3', 'F#3', 'A3', 'D4']], [2, ['G2', 'D3', 'G3', 'B3']], [4, ['F#2', 'D3', 'A3', 'D4']], [6, ['A2', 'E3', 'A3', 'C#4']], [8, ['D3', 'A3', 'D4', 'F#4']], [10, ['B2', 'F#3', 'B3', 'D4']], [12, ['G2', 'D3', 'G3', 'B3']], [13, ['A2', 'E3', 'G3', 'C#4']]];

};
